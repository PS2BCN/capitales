<!DOCTYPE html>

<head>
    <meta charset="UTF-8">
    <title>Reto Mundial: Puntos y Progreso</title>
    <style>
        body { font-family: 'Segoe UI', sans-serif; display: flex; justify-content: center; padding-top: 20px; background-color: #f0f2f5; }
        .card { background: white; padding: 2rem; border-radius: 15px; box-shadow: 0 8px 16px rgba(0,0,0,0.1); width: 450px; text-align: center; position: relative; overflow: hidden; }
        
        /* Barra de Progreso */
        .progress-container { width: 100%; background-color: #eee; height: 10px; position: absolute; top: 0; left: 0; }
        #progress-bar { width: 0%; height: 100%; background: linear-gradient(90deg, #3498db, #2ecc71); transition: width 0.4s ease; }

        .header-info { display: flex; justify-content: space-between; align-items: center; margin-top: 10px; margin-bottom: 10px; }
        .continent-tag { background: #34495e; color: white; padding: 5px 12px; border-radius: 20px; font-size: 0.75rem; text-transform: uppercase; }
        .lives { color: #e74c3c; font-size: 1.2rem; }
        
        .score-display { font-size: 1.5rem; font-weight: bold; color: #2c3e50; margin: 10px 0; }
        .points-label { font-size: 0.8rem; color: #7f8c8d; text-transform: uppercase; }

        .flag-img { width: 120px; height: auto; border-radius: 8px; margin: 10px 0; box-shadow: 0 2px 5px rgba(0,0,0,0.1); border: 1px solid #eee; }
        
        .question-box { background: #e9ecef; padding: 15px; border-radius: 8px; margin: 15px 0; font-size: 1.4rem; font-weight: bold; color: #2c3e50; }
        
        input[type="text"] { width: 85%; padding: 12px; margin: 10px 0; border: 2px solid #ddd; border-radius: 8px; font-size: 1.1rem; text-align: center; }
        input[type="text"]:focus { border-color: #3498db; outline: none; }
        
        .btn-main { background: #3498db; color: white; border: none; padding: 12px 20px; border-radius: 8px; cursor: pointer; width: 100%; font-size: 1rem; font-weight: bold; transition: 0.3s; }
        .btn-main:hover { background: #2980b9; }

        #feedback { margin-top: 15px; min-height: 55px; font-weight: bold; border-radius: 8px; padding: 10px; display: none; }
        .correct { background-color: #d4edda; color: #155724; border: 1px solid #c3e6cb; }
        .incorrect { background-color: #f8d7da; color: #721c24; border: 1px solid #f5c6cb; }
        .solution { display: block; font-size: 0.85em; margin-top: 5px; font-weight: normal; }

        #game-over { display: none; position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(255,255,255,0.97); border-radius: 15px; flex-direction: column; justify-content: center; align-items: center; z-index: 10; }
        .restart-btn { background: #2c3e50; color: white; border: none; padding: 12px 25px; border-radius: 8px; cursor: pointer; margin-top: 20px; font-weight: bold; }
    </style>
</head>

    let preguntaActual;
    let vidas = 5;
    let puntos = 0;
    let totalPreguntas = datos.length;
    let respondidas = 0;

    function nuevaPregunta() {
        if (vidas <= 0) return;

        preguntaActual = datos[Math.floor(Math.random() * datos.length)];
        
        document.getElementById('question').textContent = preguntaActual.p;
        document.getElementById('continent').textContent = preguntaActual.cont;
        document.getElementById('flag').src = `https://flagcdn.com/w160/${preguntaActual.f}.png`;
        
        document.getElementById('feedback').style.display = "none";
        const input = document.getElementById('userResponse');
        input.disabled = false;
        input.value = "";
        input.focus();
        document.getElementById('sendBtn').disabled = false;
    }

    function normalize(str) {
        return str.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "").trim();
    }

    function checkAnswer() {
        const inputElement = document.getElementById('userResponse');
        const feedback = document.getElementById('feedback');
        const userText = inputElement.value;

        if (userText.trim() === "" || inputElement.disabled) return;

        inputElement.disabled = true;
        document.getElementById('sendBtn').disabled = true;
        feedback.style.display = "block";
        respondidas++;

        // Actualizar barra de progreso
        const porcentaje = (respondidas / totalPreguntas) * 100;
        document.getElementById('progress-bar').style.width = porcentaje + "%";

        if (normalize(userText) === normalize(preguntaActual.c)) {
            puntos += 25;
            document.getElementById('score').textContent = puntos;
            feedback.innerHTML = "¡Correcto! +25 PTS 🌟";
            feedback.className = "correct";
            setTimeout(nuevaPregunta, 1000); 
        } else {
            vidas--;
            updateLives();
            feedback.innerHTML = `Incorrecto ❌ <span class="solution">La capital era: <b>${preguntaActual.c}</b></span>`;
            feedback.className = "incorrect";
            
            if (vidas > 0) {
                setTimeout(nuevaPregunta, 2500); 
            } else {
                setTimeout(gameOver, 2500);
            }
        }
    }

    function updateLives() {
        const display = document.getElementById('lives-display');
        display.textContent = "❤️".repeat(vidas) + "🖤".repeat(5 - vidas);
    }

    function gameOver() {
        document.getElementById('game-over').style.display = "flex";
        document.getElementById('final-points').textContent = `${puntos} PTS`;
        document.getElementById('final-stats').textContent = `Respondiste ${respondidas} países.`;
    }

    function resetGame() {
        vidas = 5;
        puntos = 0;
        respondidas = 0;
        document.getElementById('score').textContent = "0";
        document.getElementById('progress-bar').style.width = "0%";
        updateLives();
        document.getElementById('game-over').style.display = "none";
        nuevaPregunta();
    }

    nuevaPregunta();
</script>
