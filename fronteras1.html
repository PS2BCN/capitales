<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Fronteras Challenge: Foto Zoom Edition</title>
    <style>
        :root {
            --bg: #0f172a; --card: #1e293b; --accent: #38bdf8;
            --correct: #22c55e; --wrong: #ef4444; --reveal: #3b82f6; --bonus-gold: #fbbf24;
        }
        body {
            font-family: 'Segoe UI', sans-serif; background: var(--bg); color: white;
            display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0;
        }
        body.bonus-active { background: #451a03; }
        .game {
            background: var(--card); padding: 25px; border-radius: 20px; width: 450px;
            text-align: center; box-shadow: 0 20px 50px rgba(0,0,0,0.5); border: 1px solid #334155;
        }
        .stats { display: flex; justify-content: space-between; margin-bottom: 15px; font-weight: bold; }
        #timer-container { width: 100%; height: 8px; background: #334155; border-radius: 5px; margin-bottom: 15px; overflow: hidden; }
        #timer-bar { width: 100%; height: 100%; background: var(--accent); transition: width 0.1s linear; }
        
        #continent-badge {
            display: inline-block; background: #334155; color: var(--accent);
            padding: 4px 12px; border-radius: 20px; font-size: 0.75em;
            font-weight: bold; text-transform: uppercase; margin-bottom: 5px;
            border: 1px solid #475569;
        }

        /* Contenedor de la FOTO del País */
        #country-photo-container {
            width: 100%; height: 180px; background: #0f172a; border-radius: 12px; 
            margin-bottom: 15px; overflow: hidden; border: 2px solid #334155;
            display: flex; justify-content: center; align-items: center;
        }
        #country-photo-img { width: 100%; height: 100%; object-fit: cover; transition: opacity 0.3s; }

        .question-text { color: #94a3b8; text-transform: uppercase; font-size: 0.75em; letter-spacing: 1.2px; margin: 0; }
        h1 { margin: 2px 0 10px 0; font-size: 2.2em; color: white; }
        
        .options-container { display: flex; flex-direction: column; gap: 10px; }
        .option-btn {
            background: #334155; color: white; border: 2px solid #475569; padding: 12px;
            font-size: 1.1em; border-radius: 12px; cursor: pointer; transition: 0.2s; font-weight: bold;
        }
        .option-btn:hover:not(:disabled) { border-color: var(--accent); background: #475569; }
        .correct-anim { background: var(--correct) !important; border-color: #16a34a !important; }
        .wrong-anim { background: var(--wrong) !important; border-color: #dc2626 !important; }
        .reveal-anim { background: var(--reveal) !important; border-color: #2563eb !important; }
        
        #message { height: 20px; margin: 10px 0; font-weight: bold; font-size: 0.9em; }
        .hidden { display: none !important; }
        
        table { width: 100%; margin-top: 15px; border-collapse: collapse; font-size: 0.8em; }
        th, td { padding: 8px; border-bottom: 1px solid #334155; text-align: left; }
        input[type="text"] { width: 85%; padding: 10px; border-radius: 8px; border: 1px solid var(--accent); margin-bottom: 10px; background: #0f172a; color: white; text-align: center; }
    </style>
</head>
<body>

<div class="game" id="game-container">
    <div class="stats">
        <span style="color: #fb7185;">❤️ <span id="lives">5</span></span>
        <span id="bonus-tag" style="color: var(--bonus-gold); display:none; animation: pulse 1s infinite;">✨ BONUS ✨</span>
        <span style="color: #fbbf24;">💰 <span id="score">0</span></span>
    </div>
    <div id="timer-container"><div id="timer-bar"></div></div>
    
    <div id="continent-badge">Continente</div>
    <p class="question-text">¿Frontera de...?</p>
    <h1 id="country">Cargando...</h1>

    <div id="country-photo-container">
        <img id="country-photo-img" src="" alt="País en cuestión">
    </div>
    
    <div class="options-container" id="options"></div>
    <p id="message"></p>
    <p style="font-size: 0.7em; color: #94a3b8;">Próxima vida extra en: <span id="streak-bar">0</span>/1000 pts</p>
</div>

<div class="game hidden" id="over-container">
    <h1 style="color: var(--wrong);">¡GAME OVER!</h1>
    <p style="font-size: 1.8em; margin: 10px 0;">Score: <span id="final-score">0</span></p>
    
    <div id="save-section">
        <input type="text" id="player-name" placeholder="Tu nombre..." maxlength="12">
        <button class="option-btn" id="btn-save-record" style="background: var(--accent); color: #000; width: 100%;">GUARDAR RÉCORD</button>
    </div>

    <div id="ranking-section">
        <h3 style="color: var(--bonus-gold); font-size: 0.9em;">🏆 MEJORES PUNTAJES</h3>
        <table>
            <thead><tr><th>Nombre</th><th>Pts</th><th>Fecha</th></tr></thead>
            <tbody id="ranking-body"></tbody>
        </table>
        <button class="option-btn" id="btn-restart" style="margin-top: 20px; width: 100%; background: #475569;">VOLVER A JUGAR</button>
    </div>
</div>

<script>
    // Se ha ampliado la base de datos para incluir URLs de imágenes
    // NOTA: Para un entorno de producción, es recomendable usar una API de imágenes más robusta y con manejo de errores,
    // o un conjunto de imágenes pre-cargadas para evitar fallos de carga o límites de uso.
    const database = {
        "Europa": {
            "España": { borders: ["Portugal", "Francia", "Andorra"], img: "https://www.countryflags.com/wp-content/uploads/spain-flag-png-large.png" },
            "Francia": { borders: ["España", "Italia", "Bélgica", "Alemania"], img: "https://www.countryflags.com/wp-content/uploads/france-flag-png-large.png" },
            "Alemania": { borders: ["Francia", "Polonia", "Austria", "Países Bajos"], img: "https://www.countryflags.com/wp-content/uploads/germany-flag-png-large.png" },
            "Italia": { borders: ["Francia", "Suiza", "Austria", "Eslovenia"], img: "https://www.countryflags.com/wp-content/uploads/italy-flag-png-large.png" },
            "Portugal": { borders: ["España"], img: "https://www.countryflags.com/wp-content/uploads/portugal-flag-png-large.png" },
            "Reino Unido": { borders: ["Irlanda"], img: "https://www.countryflags.com/wp-content/uploads/united-kingdom-flag-png-large.png" },
            "Polonia": { borders: ["Alemania", "República Checa", "Ucrania"], img: "https://www.countryflags.com/wp-content/uploads/poland-flag-png-large.png" },
            "Grecia": { borders: ["Turquía", "Bulgaria", "Albania"], img: "https://www.countryflags.com/wp-content/uploads/greece-flag-png-large.png" },
            "Noruega": { borders: ["Suecia", "Finlandia"], img: "https://www.countryflags.com/wp-content/uploads/norway-flag-png-large.png" },
            "Suecia": { borders: ["Noruega", "Finlandia"], img: "https://www.countryflags.com/wp-content/uploads/sweden-flag-png-large.png" },
            "Suiza": { borders: ["Italia", "Francia", "Alemania", "Austria"], img: "https://www.countryflags.com/wp-content/uploads/switzerland-flag-png-large.png" },
            "Austria": { borders: ["Alemania", "Italia", "Suiza", "Hungría"], img: "https://www.countryflags.com/wp-content/uploads/austria-flag-png-large.png" },
            "Islandia": { borders: ["Ninguno"], img: "https://www.countryflags.com/wp-content/uploads/iceland-flag-png-large.png" }
        },
        "América": {
            "Brasil": { borders: ["Argentina", "Colombia", "Venezuela", "Uruguay"], img: "https://www.countryflags.com/wp-content/uploads/brazil-flag-png-large.png" },
            "Argentina": { borders: ["Chile", "Brasil", "Uruguay", "Bolivia"], img: "https://www.countryflags.com/wp-content/uploads/argentina-flag-png-large.png" },
            "México": { borders: ["EE.UU.", "Guatemala", "Belice"], img: "https://www.countryflags.com/wp-content/uploads/mexico-flag-png-large.png" },
            "Canadá": { borders: ["EE.UU."], img: "https://www.countryflags.com/wp-content/uploads/canada-flag-png-large.png" },
            "Estados Unidos": { borders: ["Canadá", "México"], img: "https://www.countryflags.com/wp-content/uploads/united-states-of-america-flag-png-large.png" },
            "Chile": { borders: ["Argentina", "Perú", "Bolivia"], img: "https://www.countryflags.com/wp-content/uploads/chile-flag-png-large.png" },
            "Colombia": { borders: ["Venezuela", "Ecuador", "Panamá", "Brasil"], img: "https://www.countryflags.com/wp-content/uploads/colombia-flag-png-large.png" },
            "Perú": { borders: ["Ecuador", "Colombia", "Brasil", "Chile"], img: "https://www.countryflags.com/wp-content/uploads/peru-flag-png-large.png" },
            "Uruguay": { borders: ["Brasil", "Argentina"], img: "https://www.countryflags.com/wp-content/uploads/uruguay-flag-png-large.png" },
            "Ecuador": { borders: ["Colombia", "Perú"], img: "https://www.countryflags.com/wp-content/uploads/ecuador-flag-png-large.png" }
        },
        "Asia": {
            "China": { borders: ["Rusia", "India", "Vietnam", "Mongolia"], img: "https://www.countryflags.com/wp-content/uploads/china-flag-png-large.png" },
            "Rusia": { borders: ["China", "Finlandia", "Ucrania", "Kazajistán"], img: "https://www.countryflags.com/wp-content/uploads/russia-flag-png-large.png" },
            "Japón": { borders: ["Ninguno"], img: "https://www.countryflags.com/wp-content/uploads/japan-flag-png-large.png" },
            "India": { borders: ["Pakistán", "China", "Nepal", "Bangladesh"], img: "https://www.countryflags.com/wp-content/uploads/india-flag-png-large.png" },
            "Turquía": { borders: ["Grecia", "Irak", "Siria", "Irán"], img: "https://www.countryflags.com/wp-content/uploads/turkey-flag-png-large.png" },
            "Corea del Sur": { borders: ["Corea del Norte"], img: "https://www.countryflags.com/wp-content/uploads/south-korea-flag-png-large.png" },
            "Tailandia": { borders: ["Malasia", "Myanmar", "Laos"], img: "https://www.countryflags.com/wp-content/uploads/thailand-flag-png-large.png" },
            "Vietnam": { borders: ["China", "Laos", "Camboya"], img: "https://www.countryflags.com/wp-content/uploads/vietnam-flag-png-large.png" }
        },
        "África": {
            "Egipto": { borders: ["Libia", "Sudán", "Israel"], img: "https://www.countryflags.com/wp-content/uploads/egypt-flag-png-large.png" },
            "Sudáfrica": { borders: ["Namibia", "Botsuana", "Zimbabue"], img: "https://www.countryflags.com/wp-content/uploads/south-africa-flag-png-large.png" },
            "Marruecos": { borders: ["Argelia", "España"], img: "https://www.countryflags.com/wp-content/uploads/morocco-flag-png-large.png" },
            "Nigeria": { borders: ["Níger", "Camerún", "Chad"], img: "https://www.countryflags.com/wp-content/uploads/nigeria-flag-png-large.png" },
            "Etiopía": { borders: ["Kenia", "Somalia", "Sudán"], img: "https://www.countryflags.com/wp-content/uploads/ethiopia-flag-png-large.png" },
            "Kenia": { borders: ["Etiopía", "Tanzania", "Uganda"], img: "https://www.countryflags.com/wp-content/uploads/kenya-flag-png-large.png" },
            "Argelia": { borders: ["Marruecos", "Túnez", "Libia"], img: "https://www.countryflags.com/wp-content/uploads/algeria-flag-png-large.png" }
        },
        "Oceanía": {
            "Australia": { borders: ["Ninguno"], img: "https://www.countryflags.com/wp-content/uploads/australia-flag-png-large.png" },
            "Nueva Zelanda": { borders: ["Ninguno"], img: "https://www.countryflags.com/wp-content/uploads/new-zealand-flag-png-large.png" },
            "Fiyi": { borders: ["Ninguno"], img: "https://www.countryflags.com/wp-content/uploads/fiji-flag-png-large.png" }
        }
    };

    const flatCountries = {};
    const continentMap = {};
    for (const cont in database) {
        for (const country in database[cont]) {
            flatCountries[country] = database[cont][country].borders; // Solo las fronteras
            continentMap[country] = cont;
        }
    }
    const countryList = Object.keys(flatCountries);

    let score = 0, lives = 5, qCount = 0, ptsLife = 0, timer, timeLeft;

    function nextCountry() {
        if (lives <= 0) { gameOver(); return; }
        qCount++;
        const isBonus = (qCount % 5 === 0);
        document.getElementById("bonus-tag").style.display = isBonus ? "inline" : "none";
        document.body.className = isBonus ? "bonus-active" : "";
        
        const target = countryList[Math.floor(Math.random() * countryList.length)];
        const continent = continentMap[target];
        
        document.getElementById("country").textContent = target;
        document.getElementById("continent-badge").textContent = continent;
        
        // Cargar imagen del país
        const imgElement = document.getElementById("country-photo-img");
        imgElement.style.opacity = "0"; // Esconde la imagen anterior
        
        // Obtener la URL de la imagen del objeto database
        const imageUrl = database[continent][target].img;
        
        if (imageUrl) {
            imgElement.src = imageUrl;
            imgElement.onload = () => imgElement.style.opacity = "1"; // Muestra la nueva imagen
            imgElement.onerror = () => {
                console.error("Error al cargar la imagen para:", target);
                imgElement.src = "https://via.placeholder.com/450x180?text=Imagen+no+disponible"; // Placeholder en caso de error
                imgElement.style.opacity = "1";
            };
        } else {
            imgElement.src = "https://via.placeholder.com/450x180?text=Imagen+no+disponible";
            imgElement.style.opacity = "1";
        }

        const valid = flatCountries[target];
        const container = document.getElementById("options");
        container.innerHTML = "";
        
        let opts = [valid[Math.floor(Math.random() * valid.length)]];
        while (opts.length < 3) {
            let fake = countryList[Math.floor(Math.random() * countryList.length)];
            // Asegurarse de que las opciones falsas sean del mismo continente si hay suficientes
            const fakeContinent = continentMap[fake];
            if (fakeContinent === continent && !valid.includes(fake) && !opts.includes(fake)) {
                opts.push(fake);
            } else if (fakeContinent !== continent && !valid.includes(fake) && !opts.includes(fake)) { // Si no hay suficientes del mismo continente, coger de otros
                opts.push(fake);
            }
        }

        opts.sort(() => Math.random() - 0.5).forEach(o => {
            const b = document.createElement("button");
            b.className = "option-btn";
            b.textContent = o;
            b.onclick = () => {
                clearInterval(timer);
                if (valid.includes(o) || (valid[0] === "Ninguno" && o === "Ninguno")) {
                    let p = isBonus ? 50 : 25; score += p; ptsLife += p;
                    if (ptsLife >= 1000) { lives++; ptsLife -= 1000; }
                    b.classList.add("correct-anim");
                    document.getElementById("message").textContent = "✅ ¡Correcto!";
                    setTimeout(nextCountry, 1000);
                } else {
                    b.classList.add("wrong-anim");
                    handleError();
                }
                updateStats();
            };
            container.appendChild(b);
        });
        startTimer();
    }

    function startTimer() {
        timeLeft = 100;
        clearInterval(timer);
        timer = setInterval(() => {
            timeLeft -= 0.8;
            document.getElementById("timer-bar").style.width = timeLeft + "%";
            if (timeLeft <= 0) handleError();
        }, 100);
    }

    function handleError() {
        clearInterval(timer);
        lives--; ptsLife = 0;
        updateStats();
        document.getElementById("message").textContent = "❌ Fallaste";
        document.querySelectorAll(".option-btn").forEach(btn => {
            if (flatCountries[document.getElementById("country").textContent].includes(btn.textContent)) btn.classList.add("reveal-anim");
            btn.disabled = true;
        });
        setTimeout(lives > 0 ? nextCountry : gameOver, 2000);
    }

    function updateStats() {
        document.getElementById("score").textContent = score;
        document.getElementById("lives").textContent = lives;
        document.getElementById("streak-bar").textContent = ptsLife;
    }

    function gameOver() {
        document.getElementById("game-container").classList.add("hidden");
        document.getElementById("over-container").classList.remove("hidden");
        document.getElementById("final-score").textContent = score;
        renderRanking();
    }

    document.getElementById("btn-save-record").onclick = function() {
        const name = document.getElementById("player-name").value.trim() || "Anónimo";
        let rank = JSON.parse(localStorage.getItem("geo_rank_v6") || "[]");
        rank.push({ name, score, date: new Date().toLocaleDateString() });
        rank.sort((a,b) => b.score - a.score);
        localStorage.setItem("geo_rank_v6", JSON.stringify(rank.slice(0,5)));
        document.getElementById("save-section").classList.add("hidden");
        renderRanking();
    };

    document.getElementById("btn-restart").onclick = () => location.reload();

    function renderRanking() {
        const rank = JSON.parse(localStorage.getItem("geo_rank_v6") || "[]");
        document.getElementById("ranking-body").innerHTML = rank.map(r => `<tr><td>${r.name}</td><td>${r.score}</td><td>${r.date}</td></tr>`).join("");
    }

    nextCountry();
</script>
</body>
</html>
