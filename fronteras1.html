<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Fronteras Challenge: Regional Zoom</title>
    <style>
        :root {
            --bg: #0f172a; --card: #1e293b; --accent: #38bdf8;
            --correct: #22c55e; --wrong: #ef4444; --reveal: #3b82f6; --bonus-gold: #fbbf24;
        }
        body {
            font-family: 'Segoe UI', sans-serif; background: var(--bg); color: white;
            display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0;
        }
        body.bonus-active { background: #451a03; }
        .game {
            background: var(--card); padding: 25px; border-radius: 20px; width: 450px;
            text-align: center; box-shadow: 0 20px 50px rgba(0,0,0,0.5); border: 1px solid #334155;
        }
        .stats { display: flex; justify-content: space-between; margin-bottom: 15px; font-weight: bold; }
        #timer-container { width: 100%; height: 8px; background: #334155; border-radius: 5px; margin-bottom: 15px; overflow: hidden; }
        #timer-bar { width: 100%; height: 100%; background: var(--accent); transition: width 0.1s linear; }
        
        #continent-badge {
            display: inline-block; background: #334155; color: var(--accent);
            padding: 4px 12px; border-radius: 20px; font-size: 0.75em;
            font-weight: bold; text-transform: uppercase; margin-bottom: 5px;
            border: 1px solid #475569;
        }

        #country-photo-container {
            width: 100%; height: 180px; background: #0f172a; border-radius: 12px; 
            margin-bottom: 15px; overflow: hidden; border: 2px solid #334155;
            display: flex; justify-content: center; align-items: center;
        }
        #country-photo-img { width: 100%; height: 100%; object-fit: contain; padding: 10px; transition: opacity 0.3s; background: #fff; }

        .question-text { color: #94a3b8; text-transform: uppercase; font-size: 0.75em; letter-spacing: 1.2px; margin: 0; }
        h1 { margin: 2px 0 10px 0; font-size: 2.2em; color: white; }
        
        .options-container { display: flex; flex-direction: column; gap: 10px; }
        .option-btn {
            background: #334155; color: white; border: 2px solid #475569; padding: 12px;
            font-size: 1.1em; border-radius: 12px; cursor: pointer; transition: 0.2s; font-weight: bold;
        }
        .option-btn:hover:not(:disabled) { border-color: var(--accent); background: #475569; }
        .correct-anim { background: var(--correct) !important; border-color: #16a34a !important; }
        .wrong-anim { background: var(--wrong) !important; border-color: #dc2626 !important; }
        .reveal-anim { background: var(--reveal) !important; border-color: #2563eb !important; }
        
        #message { height: 20px; margin: 10px 0; font-weight: bold; font-size: 0.9em; }
        .hidden { display: none !important; }
        
        table { width: 100%; margin-top: 15px; border-collapse: collapse; font-size: 0.8em; }
        th, td { padding: 8px; border-bottom: 1px solid #334155; text-align: left; }
        input[type="text"] { width: 85%; padding: 10px; border-radius: 8px; border: 1px solid var(--accent); margin-bottom: 10px; background: #0f172a; color: white; text-align: center; }
    </style>
</head>
<body>

<div class="game" id="game-container">
    <div class="stats">
        <span style="color: #fb7185;">❤️ <span id="lives">5</span></span>
        <span id="bonus-tag" style="color: var(--bonus-gold); display:none;">✨ BONUS ✨</span>
        <span style="color: #fbbf24;">💰 <span id="score">0</span></span>
    </div>
    <div id="timer-container"><div id="timer-bar"></div></div>
    
    <div id="continent-badge">Continente</div>
    <p class="question-text">¿Frontera de...?</p>
    <h1 id="country">...</h1>

    <div id="country-photo-container">
        <img id="country-photo-img" src="" alt="Bandera/Mapa">
    </div>
    
    <div class="options-container" id="options"></div>
    <p id="message"></p>
    <p style="font-size: 0.7em; color: #94a3b8;">Vida extra en: <span id="streak-bar">0</span>/1000 pts</p>
</div>

<div class="game hidden" id="over-container">
    <h1 style="color: var(--wrong);">¡GAME OVER!</h1>
    <p style="font-size: 1.8em; margin: 10px 0;">Score: <span id="final-score">0</span></p>
    <div id="save-section">
        <input type="text" id="player-name" placeholder="Nombre..." maxlength="12">
        <button class="option-btn" id="btn-save-record" style="background: var(--accent); color: #000; width: 100%;">GUARDAR</button>
    </div>
    <div id="ranking-section">
        <table>
            <thead><tr><th>Nombre</th><th>Pts</th><th>Fecha</th></tr></thead>
            <tbody id="ranking-body"></tbody>
        </table>
        <button class="option-btn" id="btn-restart" style="margin-top: 20px; width: 100%; background: #475569;">REINICIAR</button>
    </div>
</div>

<script>
    const database = {
        "Europa": {
            "España": { borders: ["Portugal", "Francia", "Andorra"], img: "https://flagcdn.com/w320/es.png" },
            "Francia": { borders: ["España", "Italia", "Bélgica", "Alemania"], img: "https://flagcdn.com/w320/fr.png" },
            "Alemania": { borders: ["Francia", "Polonia", "Austria", "Países Bajos"], img: "https://flagcdn.com/w320/de.png" },
            "Italia": { borders: ["Francia", "Suiza", "Austria", "Eslovenia"], img: "https://flagcdn.com/w320/it.png" },
            "Portugal": { borders: ["España"], img: "https://flagcdn.com/w320/pt.png" },
            "Reino Unido": { borders: ["Irlanda"], img: "https://flagcdn.com/w320/gb.png" },
            "Polonia": { borders: ["Alemania", "República Checa", "Ucrania"], img: "https://flagcdn.com/w320/pl.png" },
            "Grecia": { borders: ["Turquía", "Bulgaria", "Albania"], img: "https://flagcdn.com/w320/gr.png" }
        },
        "América": {
            "Brasil": { borders: ["Argentina", "Colombia", "Venezuela", "Uruguay"], img: "https://flagcdn.com/w320/br.png" },
            "Argentina": { borders: ["Chile", "Brasil", "Uruguay", "Bolivia"], img: "https://flagcdn.com/w320/ar.png" },
            "México": { borders: ["EE.UU.", "Guatemala", "Belice"], img: "https://flagcdn.com/w320/mx.png" },
            "Canadá": { borders: ["EE.UU."], img: "https://flagcdn.com/w320/ca.png" },
            "Estados Unidos": { borders: ["Canadá", "México"], img: "https://flagcdn.com/w320/us.png" },
            "Colombia": { borders: ["Venezuela", "Ecuador", "Panamá"], img: "https://flagcdn.com/w320/co.png" },
            "Perú": { borders: ["Ecuador", "Brasil", "Chile"], img: "https://flagcdn.com/w320/pe.png" }
        },
        "Asia": {
            "China": { borders: ["Rusia", "India", "Vietnam", "Mongolia"], img: "https://flagcdn.com/w320/cn.png" },
            "Rusia": { borders: ["China", "Finlandia", "Kazajistán"], img: "https://flagcdn.com/w320/ru.png" },
            "Japón": { borders: ["Ninguno"], img: "https://flagcdn.com/w320/jp.png" },
            "India": { borders: ["Pakistán", "China", "Nepal"], img: "https://flagcdn.com/w320/in.png" },
            "Corea del Sur": { borders: ["Corea del Norte"], img: "https://flagcdn.com/w320/kr.png" }
        },
        "África": {
            "Egipto": { borders: ["Libia", "Sudán", "Israel"], img: "https://flagcdn.com/w320/eg.png" },
            "Sudáfrica": { borders: ["Namibia", "Botsuana", "Zimbabue"], img: "https://flagcdn.com/w320/za.png" },
            "Marruecos": { borders: ["Argelia", "España"], img: "https://flagcdn.com/w320/ma.png" },
            "Nigeria": { borders: ["Níger", "Camerún", "Chad"], img: "https://flagcdn.com/w320/ng.png" },
            "Argelia": { borders: ["Marruecos", "Túnez", "Libia"], img: "https://flagcdn.com/w320/dz.png" }
        }
    };

    const flatCountries = {};
    const continentMap = {};
    for (const cont in database) {
        for (const country in database[cont]) {
            flatCountries[country] = database[cont][country].borders;
            continentMap[country] = cont;
        }
    }
    const countryList = Object.keys(flatCountries);

    let score = 0, lives = 5, qCount = 0, ptsLife = 0, timer, timeLeft;

    function nextCountry() {
        if (lives <= 0) return;
        qCount++;
        const isBonus = (qCount % 5 === 0);
        document.getElementById("bonus-tag").style.display = isBonus ? "inline" : "none";
        
        const target = countryList[Math.floor(Math.random() * countryList.length)];
        const continent = continentMap[target];
        
        document.getElementById("country").textContent = target;
        document.getElementById("continent-badge").textContent = continent;
        
        const imgElement = document.getElementById("country-photo-img");
        imgElement.style.opacity = "0";
        imgElement.src = database[continent][target].img;
        imgElement.onload = () => imgElement.style.opacity = "1";

        const valid = flatCountries[target];
        const container = document.getElementById("options");
        container.innerHTML = "";
        
        // --- LÓGICA DE OPCIONES POR CONTINENTE ---
        let opts = [valid[Math.floor(Math.random() * valid.length)]];
        
        // Filtrar países del MISMO continente que no sean el actual ni fronteras válidas
        const sameContinentPeers = Object.keys(database[continent]).filter(c => 
            c !== target && !valid.includes(c)
        );

        // Intentar llenar con países del mismo continente
        while (opts.length < 3 && sameContinentPeers.length > 0) {
            let randomIndex = Math.floor(Math.random() * sameContinentPeers.length);
            let fake = sameContinentPeers.splice(randomIndex, 1)[0];
            if (!opts.includes(fake)) opts.push(fake);
        }

        // Si faltan (ej. Oceanía tiene pocos), rellenar con el resto del mundo
        while (opts.length < 3) {
            let fake = countryList[Math.floor(Math.random() * countryList.length)];
            if (fake !== target && !valid.includes(fake) && !opts.includes(fake)) opts.push(fake);
        }

        opts.sort(() => Math.random() - 0.5).forEach(o => {
            const b = document.createElement("button");
            b.className = "option-btn";
            b.textContent = o;
            b.onclick = () => {
                clearInterval(timer);
                if (valid.includes(o) || (valid[0] === "Ninguno" && o === "Ninguno")) {
                    let p = isBonus ? 50 : 25; score += p; ptsLife += p;
                    if (ptsLife >= 1000) { lives++; ptsLife -= 1000; }
                    b.classList.add("correct-anim");
                    document.getElementById("message").textContent = "✅ ¡Correcto!";
                    setTimeout(nextCountry, 1000);
                } else {
                    b.classList.add("wrong-anim");
                    handleError();
                }
                updateStats();
            };
            container.appendChild(b);
        });
        startTimer();
    }

    function startTimer() {
        timeLeft = 100;
        clearInterval(timer);
        timer = setInterval(() => {
            timeLeft -= 0.8;
            document.getElementById("timer-bar").style.width = timeLeft + "%";
            if (timeLeft <= 0) handleError();
        }, 100);
    }

    function handleError() {
        clearInterval(timer);
        lives--; ptsLife = 0;
        updateStats();
        const target = document.getElementById("country").textContent;
        document.querySelectorAll(".option-btn").forEach(btn => {
            if (flatCountries[target].includes(btn.textContent)) btn.classList.add("reveal-anim");
            btn.disabled = true;
        });
        document.getElementById("message").textContent = "❌ Fallaste";
        setTimeout(lives > 0 ? nextCountry : gameOver, 2000);
    }

    function updateStats() {
        document.getElementById("score").textContent = score;
        document.getElementById("lives").textContent = lives;
        document.getElementById("streak-bar").textContent = ptsLife;
    }

    function gameOver() {
        document.getElementById("game-container").classList.add("hidden");
        document.getElementById("over-container").classList.remove("hidden");
        document.getElementById("final-score").textContent = score;
        renderRanking();
    }

    document.getElementById("btn-save-record").onclick = function() {
        const name = document.getElementById("player-name").value.trim() || "Anónimo";
        let rank = JSON.parse(localStorage.getItem("geo_rank_v7") || "[]");
        rank.push({ name, score, date: new Date().toLocaleDateString() });
        rank.sort((a,b) => b.score - a.score);
        localStorage.setItem("geo_rank_v7", JSON.stringify(rank.slice(0,5)));
        document.getElementById("save-section").classList.add("hidden");
        renderRanking();
    };

    document.getElementById("btn-restart").onclick = () => location.reload();

    function renderRanking() {
        const rank = JSON.parse(localStorage.getItem("geo_rank_v7") || "[]");
        document.getElementById("ranking-body").innerHTML = rank.map(r => `<tr><td>${r.name}</td><td>${r.score}</td><td>${r.date}</td></tr>`).join("");
    }

    nextCountry();
</script>
</body>
</html>
