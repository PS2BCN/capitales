<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Fronteras Challenge: Ranking Fix</title>
    <style>
        :root {
            --bg: #0f172a; --card: #1e293b; --accent: #38bdf8;
            --correct: #22c55e; --wrong: #ef4444; --reveal: #3b82f6; --bonus-gold: #fbbf24;
        }
        body {
            font-family: 'Segoe UI', sans-serif; background: var(--bg); color: white;
            display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0;
        }
        .game {
            background: var(--card); padding: 25px; border-radius: 20px; width: 450px;
            text-align: center; box-shadow: 0 20px 50px rgba(0,0,0,0.5); border: 1px solid #334155;
        }
        .stats { display: flex; justify-content: space-between; margin-bottom: 15px; font-weight: bold; }
        #timer-container { width: 100%; height: 8px; background: #334155; border-radius: 5px; margin-bottom: 15px; overflow: hidden; }
        #timer-bar { width: 100%; height: 100%; background: var(--accent); transition: width 0.1s linear; }
        
        #continent-badge {
            display: inline-block; background: #334155; color: var(--accent);
            padding: 4px 12px; border-radius: 20px; font-size: 0.75em; font-weight: bold; text-transform: uppercase; margin-bottom: 5px;
        }

        #country-photo-container {
            width: 100%; height: 160px; background: white; border-radius: 12px; 
            margin-bottom: 15px; overflow: hidden; display: flex; justify-content: center; align-items: center;
        }
        #country-photo-img { max-width: 90%; max-height: 90%; object-fit: contain; }

        h1 { margin: 2px 0 10px 0; font-size: 2.2em; color: white; }
        .options-container { display: flex; flex-direction: column; gap: 10px; }
        .option-btn {
            background: #334155; color: white; border: 2px solid #475569; padding: 12px;
            font-size: 1.1em; border-radius: 12px; cursor: pointer; font-weight: bold;
        }
        .correct-anim { background: var(--correct) !important; border-color: #16a34a !important; }
        .wrong-anim { background: var(--wrong) !important; border-color: #dc2626 !important; }
        .reveal-anim { background: var(--reveal) !important; border-color: #2563eb !important; }
        
        #message { height: 20px; margin: 10px 0; font-weight: bold; }
        .hidden { display: none !important; }
        
        /* Estilos Ranking */
        #ranking-section { margin-top: 20px; text-align: center; }
        table { width: 100%; border-collapse: collapse; margin: 15px 0; background: #0f172a; border-radius: 10px; overflow: hidden; }
        th, td { padding: 10px; text-align: left; border-bottom: 1px solid #334155; font-size: 0.9em; }
        th { background: #334155; color: var(--accent); }
        input[type="text"] { width: 80%; padding: 12px; border-radius: 8px; border: 2px solid var(--accent); margin-bottom: 10px; background: #1e293b; color: white; }
    </style>
</head>
<body>

<div class="game" id="game-container">
    <div class="stats">
        <span style="color: #fb7185;">❤️ <span id="lives">5</span></span>
        <span style="color: #fbbf24;">💰 <span id="score">0</span></span>
    </div>
    <div id="timer-container"><div id="timer-bar"></div></div>
    <div id="continent-badge">Continente</div>
    <h1 id="country">Cargando...</h1>
    <div id="country-photo-container"><img id="country-photo-img" src=""></div>
    <div class="options-container" id="options"></div>
    <p id="message"></p>
</div>

<div class="game hidden" id="over-container">
    <h1 style="color: var(--wrong);">¡FIN DEL JUEGO!</h1>
    <p style="font-size: 1.5em;">Puntos: <span id="final-score">0</span></p>
    
    <div id="save-area">
        <input type="text" id="player-name" placeholder="Tu nombre..." maxlength="12">
        <button class="option-btn" id="btn-save" style="background: var(--accent); color: #000; width: 100%; margin-top: 5px;">GUARDAR RÉCORD</button>
    </div>

    <div id="ranking-section">
        <h3 style="color: var(--bonus-gold);">🏆 TOP 5 GLOBAL</h3>
        <table id="table-scores">
            <thead><tr><th>Jugador</th><th>Pts</th><th>Fecha</th></tr></thead>
            <tbody id="ranking-body"></tbody>
        </table>
        <button class="option-btn" id="btn-restart" style="width: 100%; background: #475569; margin-top: 10px;">JUGAR DE NUEVO</button>
    </div>
</div>
