<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Retro Quiz World - BCN Edition</title>
    <link rel="stylesheet" href="https://pyscript.net/releases/2024.1.1/core.css" />
    <script type="module" src="https://pyscript.net/releases/2024.1.1/core.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background-color: #00001a; color: #00FF00; font-family: 'Courier New', Courier, monospace; }
        .retro-border { border: 2px solid #00FF00; box-shadow: 0 0 15px #00FF00; }
        .flag-shadow { filter: drop-shadow(0 0 8px #00FF00); }
        button { transition: all 0.2s; text-transform: uppercase; font-weight: bold; border: 1px solid #00FF00; }
        button:hover { box-shadow: 0 0 15px #00FF00; background-color: rgba(0, 255, 0, 0.1); }
        .audio-btn { font-size: 10px; padding: 4px 8px; margin-left: 5px; }
        /* Animación suave para la barra */
        #timer-bar { height: 100%; background-color: #ff0000; width: 100%; transition: width 1s linear; box-shadow: 0 0 10px #ff0000; }
        .glow-text { text-shadow: 0 0 5px #00FF00; }
    </style>
</head>
<body class="flex flex-col items-center p-4 min-h-screen">

    <div class="w-full max-w-md bg-black p-6 retro-border rounded-lg mt-6">
        <div class="flex justify-end mb-4 border-b border-green-900 pb-2">
            <span class="text-[10px] self-center mr-auto text-green-700 font-bold">AUDIO_CORE:</span>
            <button id="music-toggle" class="audio-btn bg-red-900/50 border-red-500 text-red-500">OFF</button>
            <button id="music-shuffle" class="audio-btn bg-blue-900/50 border-blue-500 text-blue-500">SHUFFLE</button>
        </div>

        <div class="flex justify-between text-[10px] mb-2 text-yellow-400 font-bold">
            <div id="clock">SYSTEM: --:--:--</div>
            <div id="timer-text" class="text-red-500">TIME: 15S</div>
        </div>

        <div class="w-full bg-gray-900 h-2 mb-6 border border-green-900 overflow-hidden">
            <div id="timer-bar"></div>
        </div>

        <div class="flex justify-center mb-6">
            <div class="p-1 border border-green-500 bg-green-500/10">
                <img id="country-flag" src="" class="h-20 flag-shadow hidden">
            </div>
        </div>

        <div id="question-box" class="bg-black p-4 text-center text-xl mb-6 h-24 flex items-center justify-center border-y-2 border-green-500/30 text-green-400 glow-text">
            SISTEMA LISTO...
        </div>

        <div class="grid grid-cols-1 gap-3" id="options-container">
            <button id="btn0" class="w-full py-3 bg-black text-green-500 hover:bg-green-500 hover:text-black">-</button>
            <button id="btn1" class="w-full py-3 bg-black text-green-500 hover:bg-green-500 hover:text-black">-</button>
            <button id="btn2" class="w-full py-3 bg-black text-green-500 hover:bg-green-500 hover:text-black">-</button>
            <button id="btn3" class="w-full py-3 bg-black text-green-500 hover:bg-green-500 hover:text-black">-</button>
        </div>

        <div class="mt-8 flex justify-between items-center border-t border-green-900 pt-4">
            <div id="score" class="text-lg glow-text">SCORE: 0000</div>
            <div id="lives" class="text-red-500 text-xl tracking-widest">❤❤❤❤❤</div>
        </div>
    </div>

    <section class="pyscript">

            PLAYLIST = ["musica_fondo.mp3",  "musica_fondo1.mp3", "musica_fondo2.mp3", "musica_fondo3.mp3", 
                        "musica_fondo4.mp3", "musica_fondo5.mp3", "musica_fondo6.mp3"]
            
            audio_player = window.Audio.new(PLAYLIST[0])
            audio_player.loop = True
            is_playing = False

            def toggle_music(evt):
                global is_playing
                btn = document.getElementById("music-toggle")
                if not is_playing:
                    audio_player.play()
                    btn.innerText = "ON"
                    btn.style.color = "#00FF00"
                    btn.style.borderColor = "#00FF00"
                    is_playing = True
                else:
                    audio_player.pause()
                    btn.innerText = "OFF"
                    btn.style.color = "#FF0000"
                    btn.style.borderColor = "#FF0000"
                    is_playing = False

            def shuffle_music(evt):
                track = random.choice(PLAYLIST)
                audio_player.src = track
                if is_playing: audio_player.play()

            document.getElementById("music-toggle").onclick = toggle_music
            document.getElementById("music-shuffle").onclick = shuffle_music

    "Nueva Zelanda": ["Wellington", "Auckland", "Christchurch", "Hamilton", "nz"],
    "Fiyi": ["Suva", "Lautoka", "Nadi", "Labasa", "fj"],

            score, lives, correct_ans, seconds_left, timer_id = 0, 5, "", 15, None

            def update_clock():
                document.getElementById("clock").innerText = f"SYSTEM: {datetime.now().strftime('%H:%M:%S')}"

            def countdown():
                global seconds_left
                seconds_left -= 1
                
                # Actualizar texto de tiempo
                document.getElementById("timer-text").innerText = f"REMAINING: {seconds_left}S"
                
                # Actualizar BARRA (Lógica corregida)
                bar = document.getElementById("timer-bar")
                porcentaje = (seconds_left / 15) * 100
                bar.style.width = f"{max(0, porcentaje)}%"

                if seconds_left <= 0:
                    handle_failure("TIMEOUT")

            def handle_failure(reason):
                global lives, timer_id
                window.clearInterval(timer_id)
                lives -= 1
                document.getElementById("lives").innerText = "❤" * lives
                if lives <= 0:
                    window.alert(f"SISTEMA CRASHED. SCORE FINAL: {score}")
                    reset_game()
                else:
                    next_question()

            def reset_game():
                global score, lives
                score = 0
                lives = 5
                document.getElementById("score").innerText = "SCORE: 0000"
                document.getElementById("lives").innerText = "❤❤❤❤❤"
                next_question()

            def next_question():
                global correct_ans, seconds_left, timer_id
                
                # 1. Limpiar timer actual
                if timer_id:
                    window.clearInterval(timer_id)
                
                # 2. Resetear BARRA visualmente antes de la animación
                seconds_left = 15
                bar = document.getElementById("timer-bar")
                bar.style.transition = "none" # Desactivar transición para salto instantáneo
                bar.style.width = "100%"
                document.getElementById("timer-text").innerText = "REMAINING: 15S"
                
                # Pequeño delay para reactivar la animación suave
                def start_timer():
                    bar.style.transition = "width 1s linear"
                window.setTimeout(start_timer, 50)

                # 3. Nueva pregunta
                pais = random.choice(list(PAISES.keys()))
                datos = PAISES[pais]
                correct_ans = datos[0]
                document.getElementById("question-box").innerText = f"> CAPITAL DE {pais.upper()}?"
                
                opts = datos[:]
                random.shuffle(opts)
                for i in range(4):
                    btn = document.getElementById(f"btn{i}")
                    btn.innerText = opts[i]
                
                # 4. Lanzar nuevo intervalo
                timer_id = window.setInterval(countdown, 1000)

            def check_answer(evt):
                global score
                # SUMAR PUNTOS: Si el texto del botón coincide con la capital
                if evt.target.innerText == correct_ans:
                    score += 25
                    # Formatear score con ceros a la izquierda (0025, 0050...)
                    document.getElementById("score").innerText = f"SCORE: {score:04d}"
                    next_question()
                else:
                    handle_failure("WRONG ACCESS")

            # Vincular clicks
            for i in range(4):
                document.getElementById(f"btn{i}").onclick = check_answer

            # Iniciar sistema
            window.setInterval(update_clock, 1000)
            next_question()
        </script>
    </section>
</body>
</html>
