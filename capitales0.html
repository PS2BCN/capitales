<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Retro Quiz World - Fixed</title>
    <link rel="stylesheet" href="https://pyscript.net/releases/2024.1.1/core.css" />
    <script type="module" src="https://pyscript.net/releases/2024.1.1/core.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background-color: #00001a; color: #00FF00; font-family: 'Courier New', Courier, monospace; }
        .retro-border { border: 2px solid #00FF00; box-shadow: 0 0 15px #00FF00; }
        
        /* BARRA DE TIEMPO (Roja) */
        #timer-bar-visual { 
            height: 100%; 
            width: 100%; 
            background-color: #ff0000; 
            transition: width 1s linear; 
            box-shadow: 0 0 10px #ff0000; 
        }
        
        /* BARRA DE PROGRESO (Verde) */
        #progress-bar-visual { 
            height: 100%; 
            width: 0%; 
            background-color: #00FF00; 
            transition: width 0.4s ease-out; 
            box-shadow: 0 0 15px #00FF00; 
        }

        .big-timer { font-size: 3rem; text-shadow: 0 0 10px #ff0000; }
        button { border: 1px solid #00FF00; background: black; transition: all 0.2s; }
        button:hover { background: #00FF00; color: black; }
    </style>
</head>
<body class="flex flex-col items-center p-4 min-h-screen">

    <div class="w-full max-w-md bg-black p-6 retro-border rounded-lg mt-6">
        
        <div class="flex justify-between items-center mb-4">
            <div id="system-clock" class="text-[10px] text-yellow-400 font-bold">SYSTEM: --:--:--</div>
            <div class="text-center">
                <span class="text-[10px] text-red-500 block uppercase font-bold">Time</span>
                <div id="timer-display" class="big-timer text-red-500 font-bold">15</div>
            </div>
        </div>

        <div class="w-full bg-gray-900 h-3 mb-6 border border-red-900">
            <div id="timer-bar-visual"></div>
        </div>

        <div id="question-text" class="text-center text-xl mb-6 min-h-[80px] flex items-center justify-center text-green-400 font-bold uppercase">
            CARGANDO...
        </div>

        <div class="grid grid-cols-1 gap-3" id="options-box">
            <button id="opt0" class="py-3">-</button>
            <button id="opt1" class="py-3">-</button>
            <button id="opt2" class="py-3">-</button>
            <button id="opt3" class="py-3">-</button>
        </div>

        <div class="mt-8">
            <div class="flex justify-between text-[10px] text-green-500 mb-1 font-bold">
                <span>MISSION PROGRESS</span>
                <span id="progress-stats">0/20</span>
            </div>
            <div class="w-full bg-gray-900 h-4 border border-green-900 p-[2px]">
                <div id="progress-bar-visual"></div>
            </div>
        </div>

        <div class="mt-4 flex justify-between text-sm uppercase">
            <div id="game-score">SCORE: 0000</div>
            <div id="game-lives" class="text-red-500">❤❤❤❤❤</div>
        </div>
    </div>

    <section class="pyscript">

    "Israel": ["Jerusalén", "Tel Aviv", "Haifa", "Rishon LeZion", "il"],
    "Australia": ["Canberra", "Sídney", "Melbourne", "Brisbane", "au"],
    "Nueva Zelanda": ["Wellington", "Auckland", "Christchurch", "Hamilton", "nz"],
    "Fiyi": ["Suva", "Lautoka", "Nadi", "Labasa", "fj"],
    # Puedes seguir extendiendo hasta los 186 manteniendo exactamente este formato
}
            score = 0
            lives = 5
            aciertos = 0
            meta = 20
            time_left = 15
            correct_ans = ""
            timer_interval = None

            def tick():
                global time_left
                time_left -= 1
                
                # Actualizar Número
                document.getElementById("timer-display").innerText = str(max(0, time_left))
                
                # Actualizar Barra Roja
                bar = document.getElementById("timer-bar-visual")
                pct = (time_left / 15) * 100
                bar.style.width = f"{max(0, pct)}%"

                if time_left <= 0:
                    fail()

            def fail():
                global lives, timer_interval
                window.clearInterval(timer_interval)
                lives -= 1
                document.getElementById("game-lives").innerText = "❤" * lives
                if lives <= 0:
                    window.alert("GAME OVER")
                    window.location.reload()
                else:
                    new_round()

            def new_round():
                global time_left, timer_interval, correct_ans
                if timer_interval: window.clearInterval(timer_interval)
                
                # RESET VISUAL DE BARRAS
                time_left = 15
                document.getElementById("timer-display").innerText = "15"
                t_bar = document.getElementById("timer-bar-visual")
                t_bar.style.transition = "none"
                t_bar.style.width = "100%"
                
                # Forzar reinicio de animación
                def restart(): t_bar.style.transition = "width 1s linear"
                window.setTimeout(restart, 50)

                # Nueva Pregunta
                pais = random.choice(list(PAISES.keys()))
                opciones = PAISES[pais][:]
                correct_ans = opciones[0]
                random.shuffle(opciones)

                document.getElementById("question-text").innerText = f"¿CAPITAL DE {pais.upper()}?"
                
                for i in range(4):
                    btn = document.getElementById(f"opt{i}")
                    btn.innerText = opciones[i]

                timer_interval = window.setInterval(tick, 1000)

            def check(evt):
                global score, aciertos
                if evt.target.innerText == correct_ans:
                    score += 25
                    aciertos += 1
                    document.getElementById("game-score").innerText = f"SCORE: {score:04d}"
                    
                    # Actualizar Barra Verde
                    prog_bar = document.getElementById("progress-bar-visual")
                    prog_text = document.getElementById("progress-stats")
                    pct_prog = (aciertos / meta) * 100
                    prog_bar.style.width = f"{min(100, pct_prog)}%"
                    prog_text.innerText = f"{aciertos}/{meta}"
                    
                    new_round()
                else:
                    fail()

            def clock_update():
                document.getElementById("system-clock").innerText = f"SYSTEM: {datetime.now().strftime('%H:%M:%S')}"

            # Iniciar
            for i in range(4):
                document.getElementById(f"opt{i}").onclick = check
            
            window.setInterval(clock_update, 1000)
            new_round()
        </script>
    </section>
</body>
</html>
