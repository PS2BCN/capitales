        /* MONITOR DE BANDERA: Encuadre Estilo Retro */
        .monitor-frame { 
            border: 4px solid #00FF00; 
            background-color: #020b02; 
            box-shadow: inset 0 0 30px #000, 0 0 15px rgba(0, 255, 0, 0.4);

            justify-content: center;
            padding: 25px;
            border-radius: 12px;
            position: relative;
        }

        .monitor-frame::after {
            content: " ";
            position: absolute;
            top: 0; left: 0; bottom: 0; right: 0;

            pointer-events: none;
        }

            box-shadow: 0 0 20px #00FF00;

        button:hover { background: #00FF00; color: black; box-shadow: 0 0 15px #00FF00; }

# VARIABLES GLOBALES
score = 0
lives = 5
correct_ans = ""
paises_restantes = list(PAISES_DATA.keys())
total_meta = 193
aciertos = 0

def actualizar_barra():
    global aciertos
    porcentaje = (aciertos / total_meta) * 100
    document.getElementById("progress-bar-fill").style.width = f"{porcentaje}%"
    document.getElementById("progress-stats").innerText = f"{aciertos} / {total_meta}"

def nueva_pregunta():
    global correct_ans, paises_restantes
    if not paises_restantes or lives <= 0:
        document.getElementById("question-text").innerText = "MISIÓN COMPLETADA: CONQUISTA TOTAL"
        return
    
    pais = random.choice(paises_restantes)
    paises_restantes.remove(pais)
    datos = PAISES_DATA[pais]
    correct_ans = datos[0]
    
    iso = datos[4].lower()
    img = document.getElementById("country-flag")
    img.src = f"https://flagcdn.com/w640/{iso}.png"
    img.style.display = "block"
    
    document.getElementById("question-text").innerText = f"¿CAPITAL DE {pais.upper()}?"
    
    opciones = datos[0:4]
    random.shuffle(opciones)
    for i in range(4):
        document.getElementById(f"opt{i}").innerText = opciones[i]

def manejar_click(evt):
    global score, lives, aciertos
    if evt.target.innerText == correct_ans:
        score += 50
        aciertos += 1
        document.getElementById("game-score").innerText = f"PUNTOS: {score:04d}"
        actualizar_barra()
        nueva_pregunta()
    else:
        lives -= 1
        document.getElementById("lives").innerText = "❤" * max(0, lives)
        if lives <= 0:
            window.alert(f"SISTEMA CAÍDO. PUNTOS FINALES: {score}")
            window.location.reload()
        else:
            nueva_pregunta()

for i in range(4):
    document.getElementById(f"opt{i}").onclick = manejar_click

actualizar_barra()
nueva_pregunta()
        </script>
