<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Retro Quiz World - 186 Nations</title>
    <link rel="stylesheet" href="https://pyscript.net/releases/2024.1.1/core.css" />
    <script type="module" src="https://pyscript.net/releases/2024.1.1/core.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background-color: #00001a; color: #00FF00; font-family: 'Courier New', Courier, monospace; }
        .retro-border { border: 2px solid #00FF00; box-shadow: 0 0 15px #00FF00; }
        .flag-shadow { filter: drop-shadow(0 0 10px #00FF00); border: 2px solid #00FF00; }
        
        /* Barra de Progreso (Verde Neón) */
        #progress-bar-fill { 
            height: 100%; 
            width: 0%; 
            background-color: #00FF00; 
            transition: width 0.5s ease-in-out; 
            box-shadow: 0 0 20px #00FF00; 
        }

        button { border: 1px solid #00FF00; background: black; transition: all 0.2s; text-transform: uppercase; }
        button:hover { background: #00FF00; color: black; box-shadow: 0 0 10px #00FF00; }
        .glow-text { text-shadow: 0 0 5px #00FF00; }
    </style>
</head>
<body class="flex flex-col items-center p-4 min-h-screen">

    <div class="w-full max-w-md bg-black p-6 retro-border rounded-lg mt-6">
        
        <div class="flex justify-between items-center mb-6">
            <div id="bcn-clock" class="text-lg text-yellow-400 font-bold glow-text">BARCELONA: --:--:--</div>
            <div id="lives" class="text-red-500 text-xl tracking-tighter">❤❤❤❤❤</div>
        </div>

        <div class="flex justify-center mb-8">
            <div class="p-2 bg-green-900/20 rounded">
                <img id="country-flag" src="" class="h-32 flag-shadow block mx-auto">
            </div>
        </div>

        <div id="question-text" class="text-center text-xl mb-6 min-h-[60px] flex items-center justify-center text-green-400 font-bold uppercase border-y border-green-900 py-4">
            IDENTIFICANDO TERRITORIO...
        </div>

        <div class="grid grid-cols-1 gap-3" id="options-box">
            <button id="opt0" class="py-4 text-lg">-</button>
            <button id="opt1" class="py-4 text-lg">-</button>
            <button id="opt2" class="py-4 text-lg">-</button>
            <button id="opt3" class="py-4 text-lg">-</button>
        </div>

        <div class="mt-10">
            <div class="flex justify-between text-[10px] text-green-500 mb-2 font-bold uppercase tracking-widest">
                <span>Conquista Global</span>
                <span id="progress-stats">0 / 186</span>
            </div>
            <div class="w-full bg-gray-900 h-6 border-2 border-green-500 p-[2px]">
                <div id="progress-bar-fill"></div>
            </div>
        </div>

        <div class="mt-4 text-center">
            <div id="game-score" class="text-xl glow-text">PUNTOS: 0000</div>
        </div>
    </div>

    <section class="pyscript">

    "Emiratos Árabes": ["Abu Dabi", "Dubái", "Sharjah", "Al Ain", "ae"],
    "Israel": ["Jerusalén", "Tel Aviv", "Haifa", "Rishon LeZion", "il"],
    "Australia": ["Canberra", "Sídney", "Melbourne", "Brisbane", "au"],
    "Nueva Zelanda": ["Wellington", "Auckland", "Christchurch", "Hamilton", "nz"],
    "Fiyi": ["Suva", "Lautoka", "Nadi", "Labasa", "fj"],
    # Puedes seguir extendiendo hasta los 186 manteniendo exactamente este formato
}

            # Estado del juego
            score = 0
            lives = 5
            correct_ans = ""
            paises_restantes = list(PAISES_DATA.keys())
            total_inicial = len(PAISES_DATA) # Esto debería ser 186

            def get_bcn_time():
                # Obtiene la hora de Barcelona/Madrid mediante JS para asegurar precisión
                options = {"timeZone": "Europe/Madrid", "hour": "2-digit", "minute": "2-digit", "second": "2-digit", "hour12": False}
                formatter = window.Intl.DateTimeFormat.new("es-ES", options)
                now = window.Date.new()
                document.getElementById("bcn-clock").innerText = f"BARCELONA: {formatter.format(now)}"

            def update_progress():
                aciertos = total_inicial - len(paises_restantes)
                pct = (aciertos / 186) * 100
                document.getElementById("progress-bar-fill").style.width = f"{pct}%"
                document.getElementById("progress-stats").innerText = f"{aciertos} / 186"

            def new_round():
                global correct_ans, paises_restantes
                
                if not paises_restantes or lives <= 0:
                    document.getElementById("question-text").innerText = "¡MISIÓN COMPLETADA!"
                    return

                # Selección sin repetir
                pais_actual = random.choice(paises_restantes)
                paises_restantes.remove(pais_actual) # Lo quitamos para no repetir

                datos = PAISES_DATA[pais_actual]
                correct_ans = datos[0]
                
                # Actualizar Bandera
                iso_code = datos[4]
                flag_img = document.getElementById("country-flag")
                flag_img.src = f"https://flagcdn.com/w320/{iso_code}.png"

                document.getElementById("question-text").innerText = f"¿CAPITAL DE {pais_actual.upper()}?"
                
                # Opciones (las 4 ciudades del país barajadas)
                opciones = datos[0:4]
                random.shuffle(opciones)
                
                for i in range(4):
                    btn = document.getElementById(f"opt{i}")
                    btn.innerText = opciones[i]

            def check_answer(evt):
                global score, lives
                if evt.target.innerText == correct_ans:
                    score += 50
                    document.getElementById("game-score").innerText = f"PUNTOS: {score:04d}"
                    update_progress()
                    new_round()
                else:
                    lives -= 1
                    document.getElementById("lives").innerText = "❤" * lives
                    if lives <= 0:
                        window.alert(f"SISTEMA CAÍDO. Puntos finales: {score}")
                        window.location.reload()
                    else:
                        new_round()

            # Iniciar Reloj e Interfaz
            for i in range(4):
                document.getElementById(f"opt{i}").onclick = check_answer

            window.setInterval(get_bcn_time, 1000)
            update_progress()
            new_round()
        </script>
    </section>
</body>
</html>
