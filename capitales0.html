<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Retro Quiz World - 186 Nations</title>
    <link rel="stylesheet" href="https://pyscript.net/releases/2024.1.1/core.css" />
    <script type="module" src="https://pyscript.net/releases/2024.1.1/core.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background-color: #00001a; color: #00FF00; font-family: 'Courier New', Courier, monospace; }
        .retro-border { border: 2px solid #00FF00; box-shadow: 0 0 15px #00FF00; }
        
        /* Contenedor de bandera mejorado */
        .flag-frame { 
            border: 2px solid #00FF00; 
            background-color: #000; 
            box-shadow: 0 0 20px rgba(0, 255, 0, 0.3);
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        #progress-bar-fill { 
            height: 100%; 
            width: 0%; 
            background-color: #00FF00; 
            transition: width 0.5s ease-out; 
            box-shadow: 0 0 15px #00FF00; 
        }

        button { border: 1px solid #00FF00; background: black; transition: all 0.2s; text-transform: uppercase; }
        button:hover { background: #00FF00; color: black; box-shadow: 0 0 10px #00FF00; }
    </style>
</head>
<body class="flex flex-col items-center p-4 min-h-screen">

    <div class="w-full max-w-md bg-black p-6 retro-border rounded-lg mt-6">
        
        <div class="flex justify-between items-center mb-6">
            <div id="game-score" class="text-xl font-bold">PUNTOS: 0000</div>
            <div id="lives" class="text-red-500 text-xl tracking-tighter font-bold">❤❤❤❤❤</div>
        </div>

        <div class="flex justify-center mb-6">
            <div class="flag-frame w-64 h-40">
                <img id="country-flag" src="" class="max-h-full max-w-full object-contain">
            </div>
        </div>

        <div id="question-text" class="text-center text-lg mb-6 min-h-[60px] flex items-center justify-center text-green-400 font-bold uppercase border-y border-green-900 py-4 px-2">
            ESPERANDO SEÑAL...
        </div>

        <div class="grid grid-cols-1 gap-3" id="options-box">
            <button id="opt0" class="py-4 text-lg font-bold">-</button>
            <button id="opt1" class="py-4 text-lg font-bold">-</button>
            <button id="opt2" class="py-4 text-lg font-bold">-</button>
            <button id="opt3" class="py-4 text-lg font-bold">-</button>
        </div>

        <div class="mt-8">
            <div class="flex justify-between text-[10px] text-green-500 mb-2 font-bold uppercase tracking-widest">
                <span>CONQUISTA GLOBAL</span>
                <span id="progress-stats">0 / 186</span>
            </div>
            <div class="w-full bg-gray-900 h-5 border border-green-500 p-[1px]">
                <div id="progress-bar-fill"></div>
            </div>
        </div>
    </div>

    <section class="pyscript">
        <script type="py">
            from pyscript import window, document
            import random

            # 1. DEFINIR DATOS PRIMERO (Sin espacios al inicio de la línea)
            PAISES_DATA = {

    "India": ["Nueva Delhi", "Bombay", "Calcuta", "Bangalore", "in"],
    "Pakistán": ["Islamabad", "Karachi", "Lahore", "Faisalabad", "pk"],
    "Bangladés": ["Daca", "Chittagong", "Khulna", "Rajshahi", "bd"],
    "Indonesia": ["Yakarta", "Surabaya", "Bandung", "Medan", "id"],
    "Filipinas": ["Manila", "Quezon City", "Davao", "Cebú", "ph"],
    "Vietnam": ["Hanói", "Ciudad Ho Chi Minh", "Da Nang", "Haiphong", "vn"],

    "Singapur": ["Singapur", "Bedok", "Jurong", "Tampines", "sg"],
    "Irán": ["Teherán", "Mashhad", "Isfahán", "Tabriz", "ir"],
    "Irak": ["Bagdad", "Basora", "Mosul", "Erbil", "iq"],
    "Arabia Saudita": ["Riad", "Yeda", "La Meca", "Medina", "sa"],
    "Emiratos Árabes": ["Abu Dabi", "Dubái", "Sharjah", "Al Ain", "ae"],
    "Israel": ["Jerusalén", "Tel Aviv", "Haifa", "Rishon LeZion", "il"],
    "Australia": ["Canberra", "Sídney", "Melbourne", "Brisbane", "au"],
    "Nueva Zelanda": ["Wellington", "Auckland", "Christchurch", "Hamilton", "nz"],
    "Fiyi": ["Suva", "Lautoka", "Nadi", "Labasa", "fj"],
    # Puedes seguir extendiendo hasta los 186 manteniendo exactamente este formato
            }

            # 2. VARIABLES DE ESTADO
            score = 0
            lives = 5
            correct_ans = ""
            paises_restantes = list(PAISES_DATA.keys())
            total_meta = 186 # Cambiar al total real de tu lista

            def update_ui():
                aciertos = total_meta - len(paises_restantes)
                pct = (aciertos / total_meta) * 100
                document.getElementById("progress-bar-fill").style.width = f"{pct}%"
                document.getElementById("progress-stats").innerText = f"{aciertos} / {total_meta}"

            def new_round():
                global correct_ans, paises_restantes
                
                if not paises_restantes or lives <= 0:
                    document.getElementById("question-text").innerText = "¡OBJETIVO LOGRADO!"
                    return

                # Selección aleatoria sin repetir
                pais = random.choice(paises_restantes)
                paises_restantes.remove(pais)

                datos = PAISES_DATA[pais]
                correct_ans = datos[0]
                
                # Cargar Bandera (FlagCDN usa códigos en minúscula)
                iso = datos[4].lower()
                img = document.getElementById("country-flag")
                img.src = f"https://flagcdn.com/w320/{iso}.png"

                document.getElementById("question-text").innerText = f"¿CAPITAL DE {pais.upper()}?"
                
                opciones = datos[0:4]
                random.shuffle(opciones)
                
                for i in range(4):
                    btn = document.getElementById(f"opt{i}")
                    btn.innerText = opciones[i]

            def check_click(evt):
                global score, lives
                if evt.target.innerText == correct_ans:
                    score += 50
                    document.getElementById("game-score").innerText = f"PUNTOS: {score:04d}"
                    update_ui()
                    new_round()
                else:
                    lives -= 1
                    document.getElementById("lives").innerText = "❤" * max(0, lives)
                    if lives <= 0:
                        window.alert("SISTEMA BLOQUEADO")
                        window.location.reload()
                    else:
                        new_round()

            # 3. VINCULAR EVENTOS E INICIAR
            for i in range(4):
                document.getElementById(f"opt{i}").onclick = check_click

            update_ui()
            new_round()
        </script>
    </section>
</body>
</html>
