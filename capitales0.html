<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Retro Quiz World - 186 Nations</title>
    <link rel="stylesheet" href="https://pyscript.net/releases/2024.1.1/core.css" />
    <script type="module" src="https://pyscript.net/releases/2024.1.1/core.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background-color: #00001a; color: #00FF00; font-family: 'Courier New', Courier, monospace; overflow-x: hidden; }
        .retro-border { border: 2px solid #00FF00; box-shadow: 0 0 15px #00FF00; }
        
        /* MONITOR DE BANDERA: Encuadre Estilo Retro */
        .monitor-frame { 
            border: 4px solid #00FF00; 
            background-color: #020b02; 
            box-shadow: inset 0 0 30px #000, 0 0 15px rgba(0, 255, 0, 0.4);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 25px;
            border-radius: 12px;
            position: relative;
        }

        /* Líneas de escaneo CRT */
        .monitor-frame::after {
            content: " ";
            position: absolute;
            top: 0; left: 0; bottom: 0; right: 0;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.1) 50%);
            background-size: 100% 4px;
            z-index: 2;
            pointer-events: none;
        }

        #progress-bar-fill { 
            height: 100%; 
            width: 0%; 
            background-color: #00FF00; 
            transition: width 0.6s cubic-bezier(0.23, 1, 0.32, 1); 
            box-shadow: 0 0 20px #00FF00; 
        }

        button { border: 1px solid #00FF00; background: black; transition: all 0.2s; text-transform: uppercase; font-weight: bold; }
        button:hover { background: #00FF00; color: black; box-shadow: 0 0 15px #00FF00; }
        .glow-text { text-shadow: 0 0 8px #00FF00; }
    </style>
</head>
<body class="flex flex-col items-center p-4 min-h-screen">

    <div class="w-full max-w-md bg-black p-6 retro-border rounded-lg mt-6">
        
        <div class="flex justify-between items-center mb-6">
            <div id="game-score" class="text-xl font-bold glow-text">PUNTOS: 0000</div>
            <div id="lives" class="text-red-500 text-xl tracking-tighter font-bold">❤❤❤❤❤</div>
        </div>

        <div class="flex justify-center mb-6">
            <div class="monitor-frame w-full h-52">
                <img id="country-flag" src="" class="max-h-full max-w-full" style="display: none;">
            </div>
        </div>

        <div id="question-text" class="text-center text-lg mb-6 min-h-[60px] flex items-center justify-center text-green-400 font-bold uppercase border-y border-green-900 py-4 px-2">
            INICIALIZANDO...
        </div>

        <div class="grid grid-cols-1 gap-3" id="options-box">
            <button id="opt0" class="py-4 text-lg">-</button>
            <button id="opt1" class="py-4 text-lg">-</button>
            <button id="opt2" class="py-4 text-lg">-</button>
            <button id="opt3" class="py-4 text-lg">-</button>
        </div>

        <div class="mt-10">
            <div class="flex justify-between text-[10px] text-green-500 mb-2 font-bold uppercase tracking-widest">
                <span>ESTADO DE CONQUISTA</span>
                <span id="progress-stats">0 / 186</span>
            </div>
            <div class="w-full bg-gray-900 h-6 border-2 border-green-500 p-[2px]">
                <div id="progress-bar-fill"></div>
            </div>
        </div>
    </div>

    <section class="pyscript">
        <script type="py">
from pyscript import window, document
import random

# 1. BASE DE DATOS (Alineada a la izquierda)
PAISES_DATA = {
    "España": ["Madrid", "Barcelona", "Valencia", "Sevilla", "es"],
    "Francia": ["París", "Marsella", "Lyon", "Toulouse", "fr"],
    "Italia": ["Roma", "Milán", "Nápoles", "Turín", "it"],
    "Alemania": ["Berlín", "Hamburgo", "Múnich", "Colonia", "de"],
    "Japón": ["Tokio", "Osaka", "Kioto", "Yokohama", "jp"],
    "México": ["CDMX", "Guadalajara", "Monterrey", "Puebla", "mx"],
    "Brasil": ["Brasilia", "São Paulo", "Río de Janeiro", "Salvador", "br"],
    "Argentina": ["Buenos Aires", "Córdoba", "Rosario", "Mendoza", "ar"],
    "Canadá": ["Ottawa", "Toronto", "Montreal", "Vancouver", "ca"],
    "Australia": ["Canberra", "Sídney", "Melbourne", "Perth", "au"]
}

# 2. VARIABLES GLOBALES
score = 0
lives = 5
correct_ans = ""
paises_restantes = list(PAISES_DATA.keys())
total_meta = 186
aciertos = 0

def actualizar_barra():
    global aciertos
    porcentaje = (aciertos / total_meta) * 100
    document.getElementById("progress-bar-fill").style.width = f"{porcentaje}%"
    document.getElementById("progress-stats").innerText = f"{aciertos} / {total_meta}"

def nueva_pregunta():
    global correct_ans, paises_restantes
    if not paises_restantes or lives <= 0:
        document.getElementById("question-text").innerText = "MISIÓN COMPLETADA"
        return
    
    pais = random.choice(paises_restantes)
    paises_restantes.remove(pais)
    datos = PAISES_DATA[pais]
    correct_ans = datos[0]
    
    iso = datos[4].lower()
    img = document.getElementById("country-flag")
    img.src = f"https://flagcdn.com/w640/{iso}.png"
    img.style.display = "block"
    
    document.getElementById("question-text").innerText = f"¿CAPITAL DE {pais.upper()}?"
    
    opciones = datos[0:4]
    random.shuffle(opciones)
    for i in range(4):
        document.getElementById(f"opt{i}").innerText = opciones[i]

def manejar_click(evt):
    global score, lives, aciertos
    if evt.target.innerText == correct_ans:
        score += 50
        aciertos += 1
        document.getElementById("game-score").innerText = f"PUNTOS: {score:04d}"
        actualizar_barra()
        nueva_pregunta()
    else:
        lives -= 1
        document.getElementById("lives").innerText = "❤" * max(0, lives)
        if lives <= 0:
            window.alert("SISTEMA CAÍDO")
            window.location.reload()
        else:
            nueva_pregunta()

# 3. INICIALIZACIÓN
for i in range(4):
    document.getElementById(f"opt{i}").onclick = manejar_click

actualizar_barra()
nueva_pregunta()
        </script>
    </section>
</body>
</html>
