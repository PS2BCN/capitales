<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Global Conquest - Points Fixed</title>
    <link rel="stylesheet" href="https://pyscript.net/releases/2024.1.1/core.css" />
    <script type="module" src="https://pyscript.net/releases/2024.1.1/core.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body, html { height: 100%; width: 100%; background-color: #00001a; color: #00FF00; font-family: 'Courier New', Courier, monospace; overflow: hidden; }
        .main-game-container { height: 100vh; display: flex; flex-direction: column; padding: 15px; max-width: 500px; margin: 0 auto; }
        
        /* MONITOR CRT */
        .monitor-frame { flex: 1; border: 4px solid #00FF00; background-color: #020b02; box-shadow: inset 0 0 30px #000, 0 0 15px rgba(0, 255, 0, 0.3); display: flex; align-items: center; justify-content: center; padding: 20px; border-radius: 12px; position: relative; margin: 10px 0; }
        .monitor-frame::after { content: ""; position: absolute; top: 0; left: 0; right: 0; bottom: 0; background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.1) 50%); background-size: 100% 4px; pointer-events: none; }
        
        /* BARRA DE PROGRESO */
        #progress-bar-fill { height: 100%; width: 0%; background-color: #00FF00; transition: width 0.4s ease-out; box-shadow: 0 0 15px #00FF00; }
        
        /* BOTONES */
        .opt-btn { border: 2px solid #00FF00; background: black; padding: 15px 10px; font-size: 1.1rem; font-weight: bold; text-transform: uppercase; margin-bottom: 8px; color: #00FF00; width: 100%; cursor: pointer; }
        .opt-btn:active { background: #00FF00; color: black; }
        .glow-text { text-shadow: 0 0 10px #00FF00; }
    </style>
</head>
<body>

    <div class="main-game-container">
        <div class="flex justify-between items-center py-2">
            <div id="game-score" class="text-xl font-bold glow-text uppercase">PUNTOS: 0000</div>
            <div id="lives" class="text-red-500 text-2xl font-bold">❤❤❤❤❤</div>
        </div>

        <div id="question-text" class="text-center text-sm font-bold uppercase border-y border-green-900 py-3 h-14 flex items-center justify-center text-green-400">
            CARGANDO SISTEMA...
        </div>

        <div class="monitor-frame">
            <img id="country-flag" src="" class="max-h-full max-w-full object-contain" style="display: none;">
        </div>

        <div class="flex flex-col mb-4" id="options-box">
            <button id="opt0" class="opt-btn">-</button>
            <button id="opt1" class="opt-btn">-</button>
            <button id="opt2" class="opt-btn">-</button>
            <button id="opt3" class="opt-btn">-</button>
        </div>

        <div class="pb-4">
            <div class="flex justify-between text-[10px] text-green-500 mb-1 font-bold">
                <span>CONQUISTA GLOBAL</span>
                <span id="progress-stats">0 / 0</span>
            </div>
            <div class="w-full bg-gray-900 h-5 border-2 border-green-500 p-[1px]">
                <div id="progress-bar-fill"></div>
            </div>
        </div>
    </div>

    <section class="pyscript">
        <script type="py">
from pyscript import window, document
import random

# BASE DE DATOS
PAISES_DATA = {
    "España": ["Madrid", "Barcelona", "Valencia", "Sevilla", "es"],
    "Francia": ["París", "Marsella", "Lyon", "Toulouse", "fr"],
    "Italia": ["Roma", "Milán", "Nápoles", "Turín", "it"],
    "Alemania": ["Berlín", "Hamburgo", "Múnich", "Colonia", "de"],
    "Japón": ["Tokio", "Osaka", "Kioto", "Yokohama", "jp"],
    "México": ["CDMX", "Guadalajara", "Monterrey", "Puebla", "mx"],
    "Brasil": ["Brasilia", "São Paulo", "Río de Janeiro", "Salvador", "br"],
    "Argentina": ["Buenos Aires", "Córdoba", "Rosario", "Mendoza", "ar"]
    # Puedes seguir añadiendo países aquí
}

# VARIABLES DE ESTADO
score = 0
lives = 5
correct_ans = ""
paises_restantes = list(PAISES_DATA.keys())
total_inicial = len(paises_restantes)
aciertos = 0

def refrescar_pantalla():
    """Esta función fuerza la actualización visual de los puntos y la barra"""
    global score, aciertos, total_inicial
    # Actualizar puntos con formato 0000
    document.getElementById("game-score").innerText = f"PUNTOS: {score:04d}"
    
    # Actualizar barra de progreso
    if total_inicial > 0:
        porcentaje = (aciertos / total_inicial) * 100
        document.getElementById("progress-bar-fill").style.width = f"{porcentaje}%"
        document.getElementById("progress-stats").innerText = f"{aciertos} / {total_inicial}"

def nueva_ronda():
    global correct_ans, paises_restantes
    if not paises_restantes or lives <= 0:
        document.getElementById("question-text").innerText = "CONQUISTA FINALIZADA"
        return

    pais = random.choice(paises_restantes)
    paises_restantes.remove(pais)
    
    datos = PAISES_DATA[pais]
    correct_ans = datos[0]
    
    # Mostrar bandera
    iso = datos[4].lower()
    img = document.getElementById("country-flag")
    img.src = f"https://flagcdn.com/w640/{iso}.png"
    img.style.display = "block"
    
    document.getElementById("question-text").innerText = f"¿CAPITAL DE {pais.upper()}?"
    
    # Mezclar botones
    opciones = datos[0:4]
    random.shuffle(opciones)
    for i in range(4):
        btn = document.getElementById(f"opt{i}")
        btn.innerText = opciones[i]

def manejar_clic(evt):
    global score, lives, aciertos
    
    # Limpiamos el texto para evitar errores de comparación
    respuesta = evt.target.innerText.strip()
    
    if respuesta == correct_ans.strip():
        # SUMA DE PUNTOS Y ACIERTO
        score += 50
        aciertos += 1
        refrescar_pantalla() # Actualización inmediata
        nueva_ronda()
    else:
        # FALLO
        lives -= 1
        document.getElementById("lives").innerText = "❤" * max(0, lives)
        if lives <= 0:
            window.alert(f"MISION FALLIDA. SCORE: {score}")
            window.location.reload()
        else:
            nueva_ronda()

# INICIALIZACIÓN
for i in range(4):
    document.getElementById(f"opt{i}").onclick = manejar_clic

# Arrancamos visualmente en 0
refrescar_pantalla()
nueva_ronda()
        </script>
    </section>
</body>
</html>
