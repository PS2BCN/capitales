<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Global Conquest - Retro Mobile</title>
    <link rel="stylesheet" href="https://pyscript.net/releases/2024.1.1/core.css" />
    <script type="module" src="https://pyscript.net/releases/2024.1.1/core.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        
        body, html { 
            height: 100%; 
            width: 100%; 
            background-color: #00001a; 
            color: #00FF00; 
            font-family: 'Courier New', Courier, monospace; 
            overflow: hidden; 
        }

        /* Contenedor que ocupa el 100% de la pantalla */
        .main-game-container {
            height: 100vh;
            display: flex;
            flex-direction: column;
            padding: 12px;
            max-width: 500px;
            margin: 0 auto;
            border-left: 1px solid #003300;
            border-right: 1px solid #003300;
        }

        .retro-border { border: 2px solid #00FF00; box-shadow: 0 0 15px #00FF00; }
        
        /* Monitor CRT con encuadre perfecto */
        .monitor-frame { 
            flex: 1; /* Esto hace que el monitor use todo el espacio central disponible */
            border: 4px solid #00FF00; 
            background-color: #020b02; 
            box-shadow: inset 0 0 30px #000, 0 0 15px rgba(0, 255, 0, 0.3);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            border-radius: 12px;
            position: relative;
            margin: 10px 0;
            overflow: hidden;
        }

        /* Líneas de escaneo CRT */
        .monitor-frame::after {
            content: " ";
            position: absolute;
            top: 0; left: 0; bottom: 0; right: 0;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.15) 50%);
            background-size: 100% 4px;
            z-index: 2;
            pointer-events: none;
        }

        #progress-bar-fill { 
            height: 100%; 
            width: 0%; 
            background-color: #00FF00; 
            transition: width 0.5s cubic-bezier(0.23, 1, 0.32, 1); 
            box-shadow: 0 0 20px #00FF00; 
        }

        /* Botones adaptados a móvil */
        .opt-btn { 
            border: 2px solid #00FF00; 
            background: black; 
            padding: 14px 10px;
            font-size: 1rem;
            font-weight: bold;
            text-transform: uppercase;
            margin-bottom: 8px;
            transition: 0.1s;
            cursor: pointer;
        }
        
        .opt-btn:active { 
            background: #00FF00; 
            color: black; 
            transform: scale(0.98); 
        }

        .glow-text { text-shadow: 0 0 8px #00FF00; }
        
        /* Ajuste de vidas para que no se rompa en pantallas pequeñas */
        #lives { letter-spacing: -2px; }
    </style>
</head>
<body>

    <div class="main-game-container">
        
        <div class="flex justify-between items-center py-1">
            <div id="game-score" class="text-lg font-bold glow-text">SC: 0000</div>
            <div id="lives" class="text-red-500 text-2xl font-bold">❤❤❤❤❤</div>
        </div>

        <div id="question-text" class="text-center text-sm font-bold uppercase border-y border-green-900 py-3 px-1 h-14 flex items-center justify-center text-green-400">
            INICIALIZANDO SATÉLITE...
        </div>

        <div class="monitor-frame">
            <img id="country-flag" src="" class="max-h-full max-w-full object-contain shadow-2xl" style="display: none;">
        </div>

        <div class="flex flex-col mb-2" id="options-box">
            <button id="opt0" class="opt-btn">-</button>
            <button id="opt1" class="opt-btn">-</button>
            <button id="opt2" class="opt-btn">-</button>
            <button id="opt3" class="opt-btn">-</button>
        </div>

        <div class="pb-2">
            <div class="flex justify-between text-[9px] text-green-500 mb-1 font-bold uppercase tracking-widest">
                <span>ESTADO DE CONQUISTA</span>
                <span id="progress-stats">0 / 193</span>
            </div>
            <div class="w-full bg-gray-900 h-4 border-2 border-green-500 p-[1px]">
                <div id="progress-bar-fill"></div>
            </div>
        </div>
    </div>

    <section class="pyscript">

# 2. VARIABLES DE ESTADO
score = 0
lives = 5
correct_ans = ""
paises_restantes = list(PAISES_DATA.keys())
total_meta = 193
aciertos = 0

def actualizar_barra():
    global aciertos
    porcentaje = (aciertos / total_meta) * 100
    document.getElementById("progress-bar-fill").style.width = f"{porcentaje}%"
    document.getElementById("progress-stats").innerText = f"{aciertos} / {total_meta}"

def nueva_ronda():
    global correct_ans, paises_restantes
    if not paises_restantes or lives <= 0:
        document.getElementById("question-text").innerText = "SISTEMA COMPLETADO"
        return
    
    pais = random.choice(paises_restantes)
    paises_restantes.remove(pais)
    datos = PAISES_DATA[pais]
    correct_ans = datos[0]
    
    # Imagen con código ISO en minúscula
    iso = datos[4].lower()
    img = document.getElementById("country-flag")
    img.src = f"https://flagcdn.com/w640/{iso}.png"
    img.style.display = "block"
    
    document.getElementById("question-text").innerText = f"¿CAPITAL DE {pais.upper()}?"
    
    opciones = datos[0:4]
    random.shuffle(opciones)
    for i in range(4):
        document.getElementById(f"opt{i}").innerText = opciones[i]

def manejar_clic(evt):
    global score, lives, aciertos
    if evt.target.innerText == correct_ans:
        score += 50
        aciertos += 1
        document.getElementById("game-score").innerText = f"SC: {score:04d}"
        actualizar_barra()
        nueva_ronda()
    else:
        lives -= 1
        document.getElementById("lives").innerText = "❤" * max(0, lives)
        if lives <= 0:
            window.alert(f"CONEXIÓN PERDIDA. SCORE: {score}")
            window.location.reload()
        else:
            nueva_ronda()

# 3. VINCULACIÓN DE EVENTOS E INICIO
for i in range(4):
    document.getElementById(f"opt{i}").onclick = manejar_clic

actualizar_barra() # Empieza en 0
nueva_ronda()

    </section>
</body>
</html>
