<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>WORLD CAPITALS: ARCADE HALL OF FAME</title>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
    <style>
        :root { --retro-green: #3f3; --retro-red: #f00; --retro-bg: #111; }
        body { font-family: 'Press Start 2P', cursive; background-color: #000; color: var(--retro-green); display: flex; justify-content: center; padding-top: 20px; text-transform: uppercase; }
        .card { background: var(--retro-bg); padding: 1.5rem; border: 4px solid var(--retro-green); box-shadow: 8px 8px 0px #222; width: 550px; text-align: center; position: relative; }
        
        /* BARRA PROGRESO */
        .progress-border { width: 100%; height: 15px; border: 2px solid var(--retro-green); margin: 10px 0; background: #000; }
        #progress-bar { width: 0%; height: 100%; background: var(--retro-green); transition: width 0.3s; box-shadow: 0 0 10px var(--retro-green); }

        .header-info { display: flex; justify-content: space-between; font-size: 10px; margin: 15px 0; }
        .lives { color: var(--retro-red); }
        .score-display { font-size: 18px; color: #fff; margin: 5px 0; }

        .flag-img { width: 120px; border: 3px solid #fff; margin: 10px 0; image-rendering: pixelated; }
        .question-box { border: 2px dashed var(--retro-green); padding: 15px; margin: 15px 0; font-size: 11px; min-height: 45px; display: flex; align-items: center; justify-content: center; }
        
        input[type="text"] { width: 85%; padding: 12px; background: #000; border: 2px solid var(--retro-green); color: var(--retro-green); font-family: 'Press Start 2P'; font-size: 10px; text-align: center; outline: none; }
        .btn-main { background: var(--retro-green); color: #000; border: none; padding: 15px; margin-top: 15px; cursor: pointer; width: 100%; font-family: 'Press Start 2P'; font-size: 10px; }

        /* PANTALLAS */
        #game-over, #start-screen { display: none; position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: #000; flex-direction: column; justify-content: center; align-items: center; z-index: 10; padding: 20px; box-sizing: border-box; }
        #start-screen { display: flex; }

        /* RANKING */
        .ranking-list { list-style: none; padding: 0; font-size: 10px; color: #fff; margin-top: 20px; width: 100%; }
        .ranking-item { display: flex; justify-content: space-between; margin-bottom: 8px; border-bottom: 1px solid #333; padding-bottom: 4px; }
        .blink { animation: blinker 1s linear infinite; }
        @keyframes blinker { 50% { opacity: 0; } }
    </style>
</head>
<body>

<div class="card">
    <div id="start-screen">
        <h2 style="font-size: 20px;">WORLD<br>CAPITALS</h2>
        <div id="high-score-board" class="ranking-list">
            <p style="color: var(--retro-green); margin-bottom: 15px;">TOP 5 AGENTS</p>
            <div id="scores-list"></div>
        </div>
        <button class="btn-main" onclick="startGame()" style="margin-top: 20px;">PRESS START</button>
    </div>

    <div id="game-over">
        <h1 class="blink" style="color: var(--retro-red); font-size: 20px;">MISSION FAILED</h1>
        <div class="score-display" id="final-points">0000 PTS</div>
        <div id="new-record" style="display:none; color: gold; font-size: 10px; margin: 10px;">¡NUEVO RÉCORD!</div>
        <button class="btn-main" onclick="resetGame()" style="width: auto; padding: 15px 30px;">RETRY</button>
    </div>

    <div class="progress-border"><div id="progress-bar"></div></div>
    <div class="header-info">
        <div id="continent">REGION: ---</div>
        <div id="lives-display" class="lives">LIVES: 5</div>
    </div>
    <div id="score" class="score-display">0000</div>
    <img id="flag" class="flag-img" src="" alt="FLAG">
    <div id="question" class="question-box">READY?</div>
    <input type="text" id="userResponse" placeholder="TYPE CAPITAL..." autocomplete="off" onkeypress="if(event.key==='Enter') checkAnswer()">
    <button id="sendBtn" class="btn-main" onclick="checkAnswer()">SEND</button>
    <div id="feedback" style="margin-top:15px; font-size:9px; height: 15px;"></div>
</div>

        const osc = audioCtx.createOscillator(); const gain = audioCtx.createGain();

        if (type === 'correct') {
            osc.type = 'square'; osc.frequency.setValueAtTime(600, audioCtx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(1200, audioCtx.currentTime + 0.1);
            gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
            osc.start(); osc.stop(audioCtx.currentTime + 0.1);
        } else if (type === 'wrong') {
            osc.type = 'sawtooth'; osc.frequency.setValueAtTime(150, audioCtx.currentTime);

    let current, lives = 5, score = 0, count = 0;

    function loadRanking() {
        const scores = JSON.parse(localStorage.getItem('arcade_ranking')) || [0,0,0,0,0];
        const list = document.getElementById('scores-list');
        list.innerHTML = scores.map((s, i) => `<div class="ranking-item"><span>RANK ${i+1}</span> <span>${s.toString().padStart(4, '0')} PTS</span></div>`).join('');
    }

    function saveScore(newScore) {
        let scores = JSON.parse(localStorage.getItem('arcade_ranking')) || [0,0,0,0,0];
        if (newScore > Math.min(...scores)) {
            scores.push(newScore);
            scores.sort((a, b) => b - a);
            scores = scores.slice(0, 5);
            localStorage.setItem('arcade_ranking', JSON.stringify(scores));
            return true;
        }
        return false;
    }

    function startGame() { audioCtx.resume(); document.getElementById('start-screen').style.display = 'none'; next(); }

    function next() {
        if (lives <= 0) return;
        current = datos[Math.floor(Math.random() * datos.length)];
        document.getElementById('question').textContent = `NATION: ${current.p}`;
        document.getElementById('continent').textContent = `ZONE: ${current.cont}`;
        document.getElementById('flag').src = `https://flagcdn.com/w160/${current.f}.png`;
        document.getElementById('feedback').textContent = "";
        const input = document.getElementById('userResponse');
        input.disabled = false; input.value = ""; input.focus();
        document.getElementById('sendBtn').disabled = false;
    }

    function checkAnswer() {
        const input = document.getElementById('userResponse');
        const val = input.value.trim().toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "");
        const ans = current.c.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "");
        if (!input.value.trim() || input.disabled) return;
        input.disabled = true; count++;
        document.getElementById('progress-bar').style.width = (count / datos.length * 100) + "%";
        if (val === ans) {
            score += 25; playSound('correct');
            document.getElementById('score').textContent = score.toString().padStart(4, '0');
            document.getElementById('feedback').style.color = "var(--retro-green)";
            document.getElementById('feedback').textContent = "CORRECT!";
            setTimeout(next, 800);
        } else {
            lives--; playSound('wrong');
            document.getElementById('lives-display').textContent = `LIVES: ${lives}`;
            document.getElementById('feedback').style.color = "var(--retro-red)";
            document.getElementById('feedback').textContent = `FAIL! -> ${current.c}`;
            if (lives > 0) setTimeout(next, 2000); else setTimeout(over, 1500);
        }
    }

    function over() {
        document.getElementById('game-over').style.display = 'flex';
        document.getElementById('final-points').textContent = `${score.toString().padStart(4, '0')} PTS`;
        const isNew = saveScore(score);
        document.getElementById('new-record').style.display = isNew ? 'block' : 'none';
        loadRanking();
    }

    function resetGame() {
        lives = 5; score = 0; count = 0;
        document.getElementById('score').textContent = "0000";
        document.getElementById('lives-display').textContent = "LIVES: 5";
        document.getElementById('progress-bar').style.width = "0%";
        document.getElementById('game-over').style.display = 'none';
        next();
    }

    loadRanking();
</script>
</body>
</html>
