<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Retro Quiz World - BCN Edition</title>
    <link rel="stylesheet" href="https://pyscript.net/releases/2024.1.1/core.css" />
    <script type="module" src="https://pyscript.net/releases/2024.1.1/core.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background-color: #00001a; color: #00FF00; font-family: 'Courier New', Courier, monospace; }
        .retro-border { border: 2px solid #00FF00; box-shadow: 0 0 15px #00FF00; }
        .flag-shadow { filter: drop-shadow(0 0 8px #00FF00); }
        button { transition: all 0.2s; text-transform: uppercase; font-weight: bold; border: 1px solid #00FF00; }
        button:hover { box-shadow: 0 0 15px #00FF00; background-color: rgba(0, 255, 0, 0.1); }
        .audio-btn { font-size: 10px; padding: 4px 8px; margin-left: 5px; }
        #timer-bar { transition: width 1s linear; box-shadow: 0 0 8px #ff0000; }
        .glow-text { text-shadow: 0 0 5px #00FF00; }
    </style>
</head>
<body class="flex flex-col items-center p-4 min-h-screen">

    <div class="w-full max-w-md bg-black p-6 retro-border rounded-lg mt-6">
        <div class="flex justify-end mb-4 border-b border-green-900 pb-2">
            <span class="text-[10px] self-center mr-auto text-green-700">AUDIO_CORE:</span>
            <button id="music-toggle" class="audio-btn bg-red-900/50 border-red-500 text-red-500">OFF</button>
            <button id="music-shuffle" class="audio-btn bg-blue-900/50 border-blue-500 text-blue-500">SHUFFLE</button>
        </div>

        <div class="flex justify-between text-[10px] mb-2 text-yellow-400 font-bold">
            <div id="clock">SYSTEM: --:--:--</div>
            <div id="timer-text" class="text-red-500">TIME: 15S</div>
        </div>

        <div class="w-full bg-gray-900 h-1 mb-6 border border-green-900">
            <div id="timer-bar" class="bg-red-600 h-full" style="width: 100%"></div>
        </div>

        <div class="flex justify-center mb-6">
            <div class="p-1 border border-green-500 bg-green-500/10">
                <img id="country-flag" src="" class="h-20 flag-shadow hidden">
            </div>
        </div>

        <div id="question-box" class="bg-black p-4 text-center text-xl mb-6 h-24 flex items-center justify-center border-y-2 border-green-500/30 text-green-400 glow-text">
            SISTEMA LISTO...
        </div>

        <div class="grid grid-cols-1 gap-3" id="options-container">
            <button id="btn0" class="w-full py-3 bg-black text-green-500 hover:bg-green-500 hover:text-black">-</button>
            <button id="btn1" class="w-full py-3 bg-black text-green-500 hover:bg-green-500 hover:text-black">-</button>
            <button id="btn2" class="w-full py-3 bg-black text-green-500 hover:bg-green-500 hover:text-black">-</button>
            <button id="btn3" class="w-full py-3 bg-black text-green-500 hover:bg-green-500 hover:text-black">-</button>
        </div>

        <div class="mt-8 flex justify-between items-center border-t border-green-900 pt-4">
            <div id="score" class="text-lg glow-text">SCORE: 0000</div>
            <div id="lives" class="text-red-500 text-xl tracking-widest">❤❤❤❤❤</div>
        </div>
        
        <div id="message" class="text-center text-pink-500 text-[10px] mt-4 font-bold uppercase">Status: Ready</div>
    </div>

    <section class="pyscript">
        <script type="py">
            import random
            from datetime import datetime
            from pyscript import window, document

            # --- CONFIGURACIÓN DE AUDIO ---
            # Nota: Usa enlaces directos a archivos .mp3
            PLAYLIST = [
                "https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3",
                "https://www.soundhelix.com/examples/mp3/SoundHelix-Song-2.mp3",
                "https://www.soundhelix.com/examples/mp3/SoundHelix-Song-3.mp3"
            ]
            
            audio_player = window.Audio.new(PLAYLIST[0])
            audio_player.loop = True
            is_playing = False

            def toggle_music(evt):
                global is_playing
                btn = document.getElementById("music-toggle")
                if not is_playing:
                    audio_player.play()
                    btn.innerText = "ON"
                    btn.classList.remove("text-red-500", "border-red-500", "bg-red-900/50")
                    btn.classList.add("text-green-500", "border-green-500", "bg-green-900/50")
                    is_playing = True
                else:
                    audio_player.pause()
                    btn.innerText = "OFF"
                    btn.classList.add("text-red-500", "border-red-500", "bg-red-900/50")
                    btn.classList.remove("text-green-500", "border-green-500", "bg-green-900/50")
                    is_playing = False

            def shuffle_music(evt):
                global is_playing
                new_track = random.choice(PLAYLIST)
                audio_player.src = new_track
                if is_playing:
                    audio_player.play()
                document.getElementById("message").innerText = "STATUS: TRACK SHUFFLED"

            document.getElementById("music-toggle").onclick = toggle_music
            document.getElementById("music-shuffle").onclick = shuffle_music

            # --- LÓGICA DEL JUEGO ---
            PAISES = {
                "España": ["Madrid", "Barcelona", "Valencia", "Sevilla", "es"],
                "Francia": ["París", "Marsella", "Lyon", "Toulouse", "fr"],
                "Italia": ["Roma", "Milán", "Nápoles", "Turín", "it"],
                "Alemania": ["Berlín", "Hamburgo", "Múnich", "Colonia", "de"],
                "Japón": ["Tokio", "Osaka", "Kioto", "Yokohama", "jp"],
                "México": ["CDMX", "Guadalajara", "Monterrey", "Puebla", "mx"],
                "Argentina": ["Buenos Aires", "Córdoba", "Rosario", "Mendoza", "ar"],
                "EUA": ["Washington D.C.", "Nueva York", "Los Ángeles", "Chicago", "us"],
                "Reino Unido": ["Londres", "Manchester", "Birmingham", "Glasgow", "gb"]
            }

            score, lives, correct_ans, seconds_left, timer_id = 0, 5, "", 15, None

            def update_clock():
                now = datetime.now().strftime("%H:%M:%S")
                document.getElementById("clock").innerText = f"SYSTEM: {now}"

            def countdown():
                global seconds_left
                seconds_left -= 1
                document.getElementById("timer-text").innerText = f"TIME: {seconds_left}S"
                document.getElementById("timer-bar").style.width = f"{(seconds_left/15)*100}%"
                if seconds_left <= 0: handle_fail("TIMEOUT ERROR")

            def handle_fail(msg):
                global lives, score, timer_id
                window.clearInterval(timer_id)
                lives -= 1
                document.getElementById("message").innerText = f"STATUS: {msg}"
                document.getElementById("lives").innerText = "❤" * lives
                if lives <= 0:
                    window.alert(f"GAME OVER\nSCORE: {score}")
                    score, lives = 0, 5
                    document.getElementById("score").innerText = "SCORE: 0000"
                    document.getElementById("lives").innerText = "❤❤❤❤❤"
                next_q()

            def next_q():
                global correct_ans, seconds_left, timer_id
                if timer_id: window.clearInterval(timer_id)
                seconds_left = 15
                document.getElementById("timer-bar").style.width = "100%"
                timer_id = window.setInterval(countdown, 1000)

                pais_nom = random.choice(list(PAISES.keys()))
                datos = PAISES[pais_nom]
                correct_ans = datos[0]
                
                flag_img = document.getElementById("country-flag")
                flag_img.src = f"https://flagcdn.com/w160/{datos[4]}.png"
                flag_img.classList.remove("hidden")
                document.getElementById("question-box").innerText = f"> CAPITAL DE {pais_nom.upper()}?"
                
                options = [datos[0], datos[1], datos[2], datos[3]]
                random.shuffle(options)
                for i in range(4): document.getElementById(f"btn{i}").innerText = options[i]

            def check_answer(evt):
                global score
                if evt.target.innerText == correct_ans:
                    score += 25
                    document.getElementById("score").innerText = f"SCORE: {score:04d}"
                    document.getElementById("message").innerText = "STATUS: ACCESS GRANTED"
                    next_q()
                else:
                    handle_fail("ACCESS DENIED")

            for i in range(4): document.getElementById(f"btn{i}").onclick = check_answer
            window.setInterval(update_clock, 1000)
            next_q()
        </script>
    </section>
</body>
</html>
