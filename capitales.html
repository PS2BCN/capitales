<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Retro Quiz World - BCN Edition</title>
    <link rel="stylesheet" href="https://pyscript.net/releases/2024.1.1/core.css" />
    <script type="module" src="https://pyscript.net/releases/2024.1.1/core.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background-color: #00001a; color: #00FF00; font-family: 'Courier New', Courier, monospace; }
        .retro-border { border: 2px solid #00FF00; box-shadow: 0 0 10px #00FF00; }
        .flag-shadow { filter: drop-shadow(0 0 5px #00FF00); }
        #timer-bar { transition: width 1s linear; }
    </style>
</head>
<body class="flex flex-col items-center p-4 min-h-screen">

    <div class="w-full max-w-md bg-black p-6 retro-border rounded-lg">
        <div class="flex justify-between text-xs mb-2 text-yellow-400">
            <div id="clock">BCN: --:--:--</div>
            <div id="timer-text" class="text-red-500 font-bold">TIEMPO: 15s</div>
        </div>

        <div class="w-full bg-gray-900 h-1 mb-4">
            <div id="timer-bar" class="bg-red-600 h-1" style="width: 100%"></div>
        </div>

        <div class="flex justify-center mb-4">
            <img id="country-flag" src="" class="h-16 flag-shadow hidden border border-green-500">
        </div>

        <div id="question-box" class="bg-blue-900/30 p-6 text-center text-xl mb-4 h-24 flex items-center justify-center border border-green-500/50">
            CARGANDO...
        </div>

        <div class="space-y-3" id="options-container">
            <button id="btn0" class="w-full py-4 bg-blue-900 border border-green-500 hover:bg-green-500 hover:text-black">-</button>
            <button id="btn1" class="w-full py-4 bg-blue-900 border border-green-500 hover:bg-green-500 hover:text-black">-</button>
            <button id="btn2" class="w-full py-4 bg-blue-900 border border-green-500 hover:bg-green-500 hover:text-black">-</button>
        </div>

        <div class="mt-6 flex justify-between items-center border-t border-gray-700 pt-4">
            <div id="score">PTS: 0</div>
            <div id="lives" class="text-red-500 text-xl">❤❤❤❤❤</div>
        </div>
        
        <div id="message" class="text-center text-pink-500 text-sm mt-2 font-bold italic">¡RÁPIDO!</div>
    </div>

    <section class="pyscript">
        <script type="py">
            import random
            from datetime import datetime
            from pyscript import window, document

            PAISES = {
                "España": ["Madrid", "Barcelona", "Valencia", "es"],
                "Francia": ["París", "Marsella", "Lyon", "fr"],
                "Italia": ["Roma", "Milán", "Nápoles", "it"],
                "Alemania": ["Berlín", "Hamburgo", "Múnich", "de"],
                "Reino Unido": ["Londres", "Manchester", "Birmingham", "gb"],
                "Japón": ["Tokio", "Osaka", "Kioto", "jp"],
                "México": ["Ciudad de México", "Guadalajara", "Monterrey", "mx"],
                "Brasil": ["Brasilia", "São Paulo", "Río de Janeiro", "br"]
            }

            score = 0
            lives = 5
            correct_ans = ""
            seconds_left = 15
            timer_id = None

            def update_clock():
                now = datetime.now().strftime("%H:%M:%S")
                document.getElementById("clock").innerText = f"BCN: {now}"

            def countdown():
                global seconds_left, lives, score
                seconds_left -= 1
                
                # Actualizar UI del timer
                document.getElementById("timer-text").innerText = f"TIEMPO: {seconds_left}s"
                document.getElementById("timer-bar").style.width = f"{(seconds_left/15)*100}%"

                if seconds_left <= 0:
                    window.clearInterval(timer_id)
                    lives -= 1
                    document.getElementById("message").innerText = "¡TIEMPO AGOTADO!"
                    update_lives_ui()
                    next_q()

            def update_lives_ui():
                global lives, score
                document.getElementById("lives").innerText = "❤" * lives
                if lives <= 0:
                    window.alert(f"GAME OVER. Puntos: {score}")
                    score = 0
                    lives = 5
                    document.getElementById("score").innerText = "PTS: 0"
                    update_lives_ui()

            def next_q():
                global correct_ans, seconds_left, timer_id
                
                # Reiniciar Timer
                if timer_id: window.clearInterval(timer_id)
                seconds_left = 15
                document.getElementById("timer-text").innerText = "TIEMPO: 15s"
                document.getElementById("timer-bar").style.width = "100%"
                timer_id = window.setInterval(countdown, 1000)

                pais_nom = random.choice(list(PAISES.keys()))
                datos = PAISES[pais_nom]
                correct_ans = datos[0]
                
                # Imagen y Botones
                document.getElementById("country-flag").src = f"https://flagcdn.com/w160/{datos[3]}.png"
                document.getElementById("country-flag").classList.remove("hidden")
                document.getElementById("question-box").innerText = f"¿CAPITAL DE {pais_nom.upper()}?"
                
                options = datos[:3]
                random.shuffle(options)
                for i in range(3):
                    document.getElementById(f"btn{i}").innerText = options[i]

            def check_answer(evt):
                global score, lives
                if evt.target.innerText == correct_ans:
                    score += 25
                    document.getElementById("score").innerText = f"PTS: {score}"
                    document.getElementById("message").innerText = "¡CORRECTO!"
                else:
                    lives -= 1
                    document.getElementById("message").innerText = "¡FALLASTE!"
                    update_lives_ui()
                
                next_q()

            for i in range(3):
                document.getElementById(f"btn{i}").onclick = check_answer

            window.setInterval(update_clock, 1000)
            next_q()
        </script>
    </section>
</body>
</html>
