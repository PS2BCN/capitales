<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Fronteras: World Conquest 175 Edition</title>
    <style>
        :root { 
            --primary: #1a252f; --bg: #d5dbdb; --danger: #c0392b; 
            --success: #27ae60; --gold: #f1c40f; --accent: #e67e22;
        }
        
        body { 
            font-family: 'Segoe UI', sans-serif; background-color: var(--bg); 
            display: flex; flex-direction: column; align-items: center; 
            margin: 0; min-height: 100vh; transition: background 1s ease;
        }
        
        @keyframes shake { 0%, 100% { transform: translateX(0); } 25% { transform: translateX(-10px); } 75% { transform: translateX(10px); } }
        .shake { animation: shake 0.4s; }

        @keyframes flash { 0% { background: white; } 100% { background: var(--bg); } }
        .flash-effect { animation: flash 1s; }

        .game-container { 
            background: white; padding: 30px; border-radius: 20px; 
            box-shadow: 0 15px 35px rgba(0,0,0,0.3); width: 90%; 
            max-width: 650px; text-align: center; margin-top: 20px;
        }
        
        .level-badge {
            background: var(--primary); color: var(--gold);
            padding: 10px 25px; border-radius: 50px; font-weight: bold;
            text-transform: uppercase; border: 3px solid var(--gold);
            margin-bottom: 20px; display: inline-block; transition: 0.5s;
        }

        .progress-container { 
            width: 100%; background: #eee; border-radius: 50px; 
            height: 25px; margin: 15px 0; border: 2px solid var(--primary);
        }
        #progress-bar { 
            width: 0%; height: 100%; background: linear-gradient(90deg, #27ae60, #f1c40f);
            transition: width 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .question-box { 
            background: #f8f9fa; padding: 25px; border-radius: 15px;
            border: 2px solid #dee2e6; margin-bottom: 10px; min-height: 80px;
        }

        input[type="text"] { 
            width: 80%; padding: 15px; font-size: 1.3rem; border-radius: 12px;
            border: 3px solid #ced4da; outline: none; text-align: center;
        }

        .btn-hint {
            background: var(--accent); color: white; border: none;
            padding: 8px 15px; border-radius: 8px; cursor: pointer;
            font-size: 0.8rem; font-weight: bold; margin-bottom: 15px;
        }

        .player {
            margin-top: 20px; background: var(--primary); color: white;
            padding: 15px; border-radius: 15px; width: 350px; text-align: center;
        }
        .btn-music { background: transparent; border: 1px solid white; color: white; padding: 8px 15px; cursor: pointer; border-radius: 8px; }
    </style>
</head>
<body id="main-body">

    <div class="game-container" id="game-card">
        <div style="display: flex; justify-content: space-between; align-items: center;">
            <div style="font-size: 1.2rem; font-weight: bold;">PUNTOS: <span id="score">0</span> / 2000</div>
            <div style="font-size: 1.8rem; color: var(--danger);" id="lives-display">❤️❤️❤️❤️❤️</div>
        </div>

        <div class="progress-container"><div id="progress-bar"></div></div>

        <div id="level-display" class="level-badge">RECLUTA 🌍</div>

        <div class="question-box">
            <p style="color: #6c757d; font-weight: bold; margin-bottom: 5px;">ESTE PAÍS LIMITA CON:</p>
            <div id="border-list" style="font-size: 1.3rem; font-weight: bold; color: #2c3e50;">Cargando desafío...</div>
        </div>

        <button class="btn-hint" onclick="getHint()">💡 PISTA CONTINENTE (-50 PTS)</button>
        <div id="hint-text" style="color: var(--accent); font-weight: bold; margin-bottom: 10px; min-height: 20px;"></div>

        <input type="text" id="user-answer" placeholder="Escribe el país..." autocomplete="off">
        <button style="margin-top:20px; width:100%; padding:15px; background:var(--primary); color:white; border:none; border-radius:12px; font-weight:bold; cursor:pointer;" onclick="processAnswer()">VERIFICAR</button>

        <div style="margin-top:15px; display:flex; justify-content: space-around; font-size: 0.9rem;">
            <span>🔥 Racha: <b id="streak">0</b></span>
            <span>💊 Recuperación: <b id="recovery">0/15</b></span>
        </div>
    </div>

    <div class="player">
        <div id="song-name" style="font-size: 11px; margin-bottom: 8px; opacity:0.7;">SID Audio Engine</div>
        <button class="btn-music" onclick="prevSong()">⏮</button>
        <button class="btn-music" id="play-pause" onclick="togglePlay()">▶</button>
        <button class="btn-music" onclick="nextSong()">⏭</button>
        <audio id="audio-player"></audio>
    </div>
