        .header-info { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }

        .lives { color: #e74c3c; font-size: 1.1rem; font-weight: bold; }
        .flag-box { width: 100%; height: 160px; display: flex; justify-content: center; align-items: center; margin: 10px 0; background: #fff; }

        .country-title { font-size: 1.8rem; color: #2c3e50; margin: 10px 0; font-weight: bold; }
        .options-list { display: flex; flex-direction: column; gap: 10px; margin-top: 15px; }
        .btn-option { background: white; border: 2px solid #3498db; color: #2c3e50; padding: 12px; border-radius: 8px; cursor: pointer; font-size: 1.1rem; font-weight: 600; transition: 0.2s; }
        .btn-option:hover { background: #3498db; color: white; transform: translateY(-2px); }
        .btn-option:disabled { opacity: 0.7; cursor: not-allowed; }
        #feedback { margin-top: 15px; min-height: 50px; font-weight: bold; border-radius: 8px; padding: 10px; display: none; }
        .correct { background-color: #d4edda; color: #155724; }
        .incorrect { background-color: #f8d7da; color: #721c24; }
        #game-over { display: none; position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: white; border-radius: 15px; flex-direction: column; justify-content: center; align-items: center; z-index: 10; }
        .restart-btn { background: #2c3e50; color: white; border: none; padding: 10px 20px; border-radius: 8px; cursor: pointer; margin-top: 20px; font-weight: bold; }

    let pActual;
    let vidas = 5;
    let aciertos = 0;

    function iniciar() {
        if (vidas <= 0) return;
        
        pActual = datos[Math.floor(Math.random() * datos.length)];
        
        // UI
        document.getElementById('country-name').textContent = pActual.p;
        document.getElementById('continent').textContent = pActual.cont;
        
        const fImg = document.getElementById('flag');
        fImg.src = `https://flagcdn.com/w320/${pActual.f.toLowerCase()}.png`;

        // Crear 3 opciones
        let opciones = [pActual.c];
        while (opciones.length < 3) {
            let f = datos[Math.floor(Math.random() * datos.length)].c;
            if (!opciones.includes(f)) opciones.push(f);
        }
        opciones.sort(() => Math.random() - 0.5);

        // Limpiar
        document.getElementById('feedback').style.display = "none";
        const contBtn = document.getElementById('options-container');
        contBtn.innerHTML = '';

        opciones.forEach(o => {
            const b = document.createElement('button');
            b.className = 'btn-option';
            b.textContent = o;
            b.onclick = () => revisar(o);
            contBtn.appendChild(b);
        });
    }

    function revisar(sel) {
        const feed = document.getElementById('feedback');
        document.querySelectorAll('.btn-option').forEach(b => b.disabled = true);
        feed.style.display = "block";

        if (sel === pActual.c) {
            aciertos++;
            document.getElementById('score').textContent = aciertos;
            feed.innerHTML = "¡Correcto! 🌟";
            feed.className = "correct";
            setTimeout(iniciar, 1000);
        } else {
            vidas--;
            updateCorazones();
            feed.innerHTML = `Incorrecto ❌ Es <b>${pActual.c}</b>`;
            feed.className = "incorrect";
            if (vidas > 0) setTimeout(iniciar, 2000);
            else setTimeout(fin, 2000);
        }
    }

    function updateCorazones() {
        document.getElementById('lives-display').textContent = "❤️".repeat(vidas) + "🖤".repeat(5 - vidas);
    }

    function fin() {
        document.getElementById('game-over').style.display = "flex";
        document.getElementById('final-score').textContent = `Lograste ${aciertos} aciertos.`;
    }

    function resetGame() {
        vidas = 5; aciertos = 0;
        document.getElementById('score').textContent = "0";
        updateCorazones();
        document.getElementById('game-over').style.display = "none";
        iniciar();
    }

    iniciar();
