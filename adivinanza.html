<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>C64 ADIVINANZA</title>
    <style>
        /* Estilo retro Commodore 64 */
        body {
            background-color: #4040ff; /* Azul exterior */
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            font-family: 'Courier New', Courier, monospace;
            color: #a0a0ff; /* Azul claro / Celeste */
        }

        #screen {
            background-color: #0000aa; /* Azul interior */
            width: 80%;
            max-width: 600px;
            padding: 20px;
            border: 20px solid #4040ff;
            box-shadow: 10px 10px 0px #000;
            text-align: left;
            position: relative;
        }

        h1, p {
            text-transform: uppercase;
            letter-spacing: 2px;
            margin: 10px 0;
        }

        .cursor {
            display: inline-block;
            width: 10px;
            height: 15px;
            background-color: #a0a0ff;
            animation: blink 0.8s infinite;
        }

        @keyframes blink { 50% { opacity: 0; } }

        input {
            background: transparent;
            border: none;
            color: #a0a0ff;
            font-family: inherit;
            font-size: 1.2rem;
            text-transform: uppercase;
            outline: none;
            width: 100px;
        }

        button {
            background-color: #a0a0ff;
            color: #0000aa;
            border: none;
            padding: 5px 15px;
            font-family: inherit;
            font-weight: bold;
            cursor: pointer;
            text-transform: uppercase;
            margin-top: 10px;
        }

        button:hover { background-color: #fff; }

        .back-link {
            margin-top: 20px;
            color: #a0a0ff;
            text-decoration: none;
            font-size: 0.8rem;
        }

        /* Mini Player Integrado */
        .mini-player {
            margin-top: 30px;
            background: #0000aa;
            border: 2px solid #a0a0ff;
            padding: 10px;
            width: 300px;
            text-align: center;
        }
    </style>
</head>
<body>

    <div id="screen">
        <p>**** COMMODORE 64 BASIC V2 ****</p>
        <p>64K RAM SYSTEM  38911 BASIC BYTES FREE</p>
        <p>READY.</p>
        <p>LOAD "ADIVINANZA",8,1</p>
        <p>SEARCHING FOR ADIVINANZA</p>
        <p>LOADING</p>
        <p>READY.</p>
        <p>RUN</p>
        <hr style="border: 1px solid #a0a0ff;">
        
        <h1>GUESS THE NUMBER (1-100)</h1>
        <p id="message">ADIVINA EL NUMERO DEL 1 AL 100:</p>
        <div>
            <span style="color:white">></span>
            <input type="number" id="guessInput" min="1" max="100" autofocus>
            <span class="cursor"></span>
        </div>
        <button onclick="checkGuess()">ENTER</button>
        <p>INTENTOS: <span id="attempts">0</span></p>
    </div>

    <a href="index.html" class="back-link">RETURN TO MENU</a>

    <div class="mini-player">
        <div id="song-info" style="font-size: 10px; margin-bottom: 5px;">SID CHIP READY...</div>
        <button onclick="prevSong()">⏮</button>
        <button id="play-pause" onclick="togglePlay()">▶</button>
        <button onclick="nextSong()">⏭</button>
        <audio id="audio-player"></audio>
    </div>

    <script>
        // Lógica del Juego
        const secretNumber = Math.floor(Math.random() * 100) + 1;
        let attempts = 0;

        function checkGuess() {
            const input = document.getElementById('guessInput');
            const message = document.getElementById('message');
            const attemptsDisplay = document.getElementById('attempts');
            const guess = parseInt(input.value);

            if (isNaN(guess)) return;

            attempts++;
            attemptsDisplay.innerText = attempts;

            if (guess === secretNumber) {
                message.innerText = "!!! GANASTE !!! EL NUMERO ERA " + secretNumber;
                message.style.color = "#fff";
                input.disabled = true;
            } else if (guess < secretNumber) {
                message.innerText = "MAS ALTO...";
            } else {
                message.innerText = "MAS BAJO...";
            }
            input.value = "";
            input.focus();
        }

        // Lógica del Reproductor
        const audio = document.getElementById('audio-player');
        const playBtn = document.getElementById('play-pause');
        const songTitle = document.getElementById('song-info');
        const songs = ['musica_fondo.mp3', 'musica_fondo1.mp3', 'musica_fondo2.mp3', 'musica_fondo3.mp3', 'musica_fondo4.mp3', 'musica_fondo5.mp3', 'musica_fondo6.mp3'];
        let currentSongIndex = 0;

        function loadSong(index) {
            audio.src = songs[index];
            songTitle.innerText = `SID: ${songs[index]}`;
        }
        function togglePlay() {
            if (audio.paused) { audio.play(); playBtn.innerText = "⏸"; }
            else { audio.pause(); playBtn.innerText = "▶"; }
        }
        function nextSong() {
            currentSongIndex = (currentSongIndex + 1) % songs.length;
            loadSong(currentSongIndex);
            audio.play();
            playBtn.innerText = "⏸";
        }
        function prevSong() {
            currentSongIndex = (currentSongIndex - 1 + songs.length) % songs.length;
            loadSong(currentSongIndex);
            audio.play();
            playBtn.innerText = "⏸";
        }
        audio.onended = nextSong;
        loadSong(currentSongIndex);
    </script>
</body>
</html>
